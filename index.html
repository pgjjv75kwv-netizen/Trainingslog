<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="theme-color" content="#0f172a">
<title>Trainingslog</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f172a'/%3E%3Cg fill='none' stroke='%23f97316' stroke-width='13' stroke-linecap='round'%3E%3Cpath d='M40 90h100'/%3E%3Cpath d='M40 66v48M140 66v48'/%3E%3C/g%3E%3C/svg%3E">
<style>
html, body { margin: 0; padding: 0; background: #f8fafc; }
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  #root, #root * { box-sizing: border-box; }
  #root {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f8fafc; color: #0f172a;
    max-width: 460px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 96px; position: relative;
  }
  #root .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  #root button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  #root input, #root textarea { font: inherit; color: inherit; }
  #root input:focus-visible, #root button:focus-visible, #root textarea:focus-visible {
    outline: 2px solid #f97316; outline-offset: 1px;
  }

  #root .hdr { position: sticky; top: 0; z-index: 20; background: #0f172a; color: #fff; padding: 16px 16px 12px; }
  #root .hdr-top { display: flex; justify-content: space-between; align-items: baseline; }
  #root .hdr-top h1 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  #root .hdr-top span { font-size: 12px; color: #94a3b8; }
  #root .row { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
  #root .chip-d { font-size: 12px; padding: 4px 10px; border-radius: 6px; background: #1e293b; color: #cbd5e1; }
  #root .chip-d.on { background: #fff; color: #0f172a; font-weight: 600; }
  #root .stat { font-size: 10px; text-transform: none; letter-spacing: 0; font-weight: 600;
    padding: 2px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
  #root .stat.ok { background: #14532d; color: #86efac; }
  #root .stat.warn { background: #78350f; color: #fcd34d; }
  #root .stat.bad { background: #7f1d1d; color: #fca5a5; }
  #root .days { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 2px; }
  #root .day { flex: 0 0 auto; font-size: 12px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid #334155; color: #cbd5e1; background: transparent; }
  #root .day.on { background: #f97316; border-color: #f97316; color: #fff; font-weight: 600; }

  #root main { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  #root .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  #root .card.warm { border-style: dashed; }
  #root .pad { padding: 14px 16px 12px; }

  #root .exhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  #root .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    font-weight: 700; color: #94a3b8; display: block; margin-bottom: 3px; }
  #root .exname { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; }
  #root .count { flex: 0 0 auto; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: #f8fafc; color: #94a3b8; }
  #root .count.part { background: #f1f5f9; color: #475569; }
  #root .count.full { background: #0f172a; color: #fff; }

  #root .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
  #root .goal { font-size: 11px; border: 1px solid #e2e8f0; background: #f8fafc; color: #64748b;
    padding: 2px 6px; border-radius: 6px; }
  #root .lastbtn { font-size: 11px; border: 1px solid #fed7aa; background: #fff7ed; color: #9a3412;
    padding: 2px 6px; border-radius: 6px; }
  #root .lastbtn b { font-weight: 700; }
  #root .lastbtn .d { color: #fb923c; }
  #root .nolast { font-size: 11px; color: #94a3b8; }
  #root .hint { font-size: 11px; color: #64748b; margin: 8px 0 0; }

  #root .hist { margin-top: 8px; border: 1px solid #e2e8f0; border-radius: 8px; background: #f8fafc; }
  #root .hist div { display: flex; justify-content: space-between; gap: 10px;
    padding: 6px 10px; font-size: 11px; border-top: 1px solid #e2e8f0; }
  #root .hist div:first-child { border-top: none; }
  #root .hist .l { color: #64748b; }
  #root .hist .r { color: #1e293b; }

  #root .prog { margin-top: 10px; font-size: 11px; font-weight: 600; color: #c2410c;
    background: #fff7ed; border: 1px solid #fed7aa; border-radius: 6px; padding: 5px 8px; }

  #root .sets { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  #root .setrow { display: flex; align-items: center; gap: 10px; }
  #root .setno { width: 14px; flex: 0 0 auto; font-size: 11px; color: #94a3b8; }
  #root .step { flex: 1; display: flex; border: 1px solid #cbd5e1; border-radius: 8px;
    overflow: hidden; background: #fff; }
  #root .step button { width: 46px; flex: 0 0 auto; font-size: 20px; color: #64748b; padding: 8px 0; }
  #root .step button:active { background: #f1f5f9; }
  #root .val { flex: 1; min-width: 0; width: 100%; text-align: center; padding: 8px 0;
    border: none; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0;
    font-size: 22px; font-weight: 600; line-height: 1.1; background: #fff;
    color: #0f172a; border-radius: 0; -moz-appearance: textfield; appearance: textfield; }
  #root .val::-webkit-outer-spin-button,
  #root .val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #root .val::placeholder { color: #cbd5e1; opacity: 1; }
  #root .val.beat { color: #ea580c; background: #fff7ed; }
  #root .unit { flex: 0 0 auto; align-self: center; font-size: 11px; color: #94a3b8;
    margin-left: -18px; padding-right: 6px; pointer-events: none; }
  #root .clr { width: 26px; flex: 0 0 auto; color: #cbd5e1; font-size: 18px; }

  #root .opts { width: 100%; padding: 8px 16px; text-align: left; font-size: 12px; color: #64748b;
    border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
  #root .optbody { padding: 4px 16px 16px; border-top: 1px solid #f1f5f9; background: #f8fafc;
    display: flex; flex-direction: column; gap: 12px; }
  #root .fld { display: flex; align-items: center; gap: 12px; }
  #root .fld label { font-size: 12px; color: #475569; width: 96px; flex: 0 0 auto; }
  #root input[type=number], #root input[type=text] {
    border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; font-size: 14px; background: #fff; }
  #root input[type=number] { width: 78px; }
  #root input[type=text] { width: 100%; }
  #root .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  #root .tag { font-size: 12px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid #cbd5e1; background: #fff; color: #475569; }
  #root .tag.on { background: #0f172a; color: #fff; border-color: #0f172a; }
  #root .tag.warn.on { background: #fef3c7; color: #78350f; border-color: #fcd34d; }
  #root .num { display: flex; gap: 4px; }
  #root .num button { width: 36px; height: 32px; border-radius: 6px; border: 1px solid #cbd5e1;
    background: #fff; color: #475569; font-size: 12px; }
  #root .num button.on { background: #0f172a; color: #fff; border-color: #0f172a; }

  #root .simple { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  #root .simple > span { font-size: 14px; color: #334155; }
  #root textarea { width: 100%; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 12px 16px; font-size: 14px; resize: none; background: #fff; }

  #root .savebar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px 16px;
    background: linear-gradient(to top, #f8fafc 70%, rgba(248,250,252,0)); }
  #root .savebar .inner { max-width: 460px; margin: 0 auto; }
  #root .save { width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: #0f172a; color: #fff; }
  #root .save[disabled] { background: #e2e8f0; color: #94a3b8; cursor: default; }

  #root .toast { position: fixed; bottom: 96px; left: 0; right: 0; display: flex; justify-content: center;
    pointer-events: none; }
  #root .toast span { background: #0f172a; color: #fff; font-size: 12px; padding: 8px 16px; border-radius: 999px; }
  #root .err { margin: 12px 16px 0; background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
    font-size: 12px; padding: 8px 12px; border-radius: 8px; }
  #root .empty { border: 1px dashed #cbd5e1; border-radius: 12px; padding: 40px 16px; text-align: center; }
  #root .empty p { color: #64748b; font-size: 14px; margin: 0 0 12px; }
  #root .sess { font-size: 12px; display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  #root .sess .n { color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #root .sess .n.warm { color: #94a3b8; }
  #root .meta { margin: 8px 0 0; padding-top: 8px; border-top: 1px solid #f1f5f9;
    font-size: 11px; color: #64748b; }
  #root .exp textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; line-height: 1.4; background: #f8fafc; }
  @media (prefers-reduced-motion: reduce) { #root * { transition: none !important; } }

</style>
</head>
<body>
<div id="root"></div>
<script>

(function () {
  "use strict";

  /* ------------------------- Plan ------------------------- */
  var V = {
    pull: ["normal", "Chin-up", "negativ", "mit Band", "Zusatzgewicht"],
    row: ["Fersen am Boden", "Füße erhöht", "Stange tiefer"],
    dip: ["normal", "negativ", "Bank-Dips", "Zusatzgewicht"],
    push: ["an Bars (tiefer)", "am Boden", "Füße erhöht", "Pseudo-Planche"],
    pike: ["normal", "Füße erhöht", "Wand-HSPU"],
    hs: ["Brust zur Wand", "Rücken zur Wand", "frei"],
    lever: ["Tuck", "Advanced Tuck", "One Leg"],
    none: []
  };

  function P(id, name, unit, sets, min, max, variants, warmup, total) {
    return { id: id, name: name, unit: unit, sets: sets, min: min, max: max,
             variants: variants || V.none, warmup: !!warmup, total: total || null };
  }

  var PLANS = {
    a: { label: "3 Tage", days: [
      { id: "a1", name: "Zug", ex: [
        P("scapula", "Scapula Pull-ups + aktives Hängen", "reps", 2, 6, 8, V.none, true),
        P("lever", "Tuck Front Lever Hold", "sec", 4, 10, 20, V.lever),
        P("pullup", "Klimmzüge", "reps", 4, 3, 6, V.pull),
        P("row", "Australian Rows", "reps", 3, 8, 12, V.row),
        P("pushup", "Liegestütze", "reps", 3, 10, 15, V.push),
        P("hollow", "Hollow Body Hold", "sec", 3, 15, 30)
      ]},
      { id: "a2", name: "Druck", ex: [
        P("support", "Stützhalte + Handgelenke", "sec", 2, 15, 20, V.none, true),
        P("handstand", "Handstand an der Wand", "sec", 5, 10, 20, V.hs, false, [60, 60]),
        P("dips", "Dips", "reps", 4, 4, 8, V.dip),
        P("pike", "Pike Push-ups", "reps", 3, 6, 10, V.pike),
        P("bss", "Bulgarian Split Squats", "side", 3, 8, 12),
        P("knieheben", "Hängendes Knieheben", "reps", 3, 8, 12)
      ]},
      { id: "a3", name: "Gemischt", ex: [
        P("scapula", "Scapula Pull-ups + Stützhalte", "reps", 2, 6, 8, V.none, true),
        P("handstand", "Handstand an der Wand", "sec", 5, 10, 20, V.hs, false, [60, 90]),
        P("lever", "Tuck Front Lever Hold", "sec", 3, 10, 20, V.lever),
        P("pullup", "Klimmzüge (Chin-up-Griff)", "reps", 3, 3, 6, V.pull),
        P("dips", "Dips", "reps", 3, 4, 8, V.dip),
        P("squat", "Kniebeugen", "reps", 3, 15, 20),
        P("hollow", "Hollow Body Hold", "sec", 3, 15, 30)
      ]}
    ]},
    b: { label: "4 Tage", days: [
      { id: "b1", name: "Zug A", ex: [
        P("scapula", "Scapula Pull-ups + aktives Hängen", "reps", 2, 6, 8, V.none, true),
        P("lever", "Tuck Front Lever Hold", "sec", 4, 10, 20, V.lever),
        P("pullup", "Klimmzüge", "reps", 4, 3, 6, V.pull),
        P("pullup_neg", "Negative Klimmzüge", "reps", 3, 3, 5),
        P("row", "Australian Rows", "reps", 3, 8, 12, V.row),
        P("knieheben", "Hängendes Knieheben", "reps", 3, 8, 12)
      ]},
      { id: "b2", name: "Druck A", ex: [
        P("support", "Stützhalte + Handgelenke", "sec", 2, 15, 20, V.none, true),
        P("handstand", "Handstand an der Wand", "sec", 5, 10, 20, V.hs, false, [60, 90]),
        P("dips", "Dips", "reps", 4, 4, 8, V.dip),
        P("pushup", "Liegestütze", "reps", 3, 10, 15, V.push),
        P("bss", "Bulgarian Split Squats", "side", 3, 8, 12),
        P("hollow", "Hollow Body Hold", "sec", 3, 15, 30)
      ]},
      { id: "b3", name: "Zug B", ex: [
        P("scapula", "Scapula Pull-ups + aktives Hängen", "reps", 2, 6, 8, V.none, true),
        P("lever", "Tuck Front Lever Hold", "sec", 3, 10, 20, V.lever),
        P("chinup", "Chin-ups (Untergriff)", "reps", 4, 4, 7, V.pull),
        P("row", "Australian Rows (Füße erhöht)", "reps", 3, 8, 12, V.row),
        P("knieheben", "Hängendes Knieheben", "reps", 3, 8, 12),
        P("hang", "Aktives Hängen (Finisher)", "sec", 2, 20, 30)
      ]},
      { id: "b4", name: "Druck B", ex: [
        P("support", "Stützhalte + Handgelenke", "sec", 2, 15, 20, V.none, true),
        P("handstand", "Handstand an der Wand", "sec", 5, 10, 20, V.hs, false, [45, 60]),
        P("pike", "Pike Push-ups", "reps", 4, 6, 10, V.pike),
        P("dips", "Dips", "reps", 3, 4, 8, V.dip),
        P("squat", "Kniebeugen + Wadenheben", "reps", 3, 15, 20),
        P("hollow", "Hollow Body Hold", "sec", 3, 15, 30)
      ]}
    ]}
  };

  var KEY = "calisthenics:data";
  var PARTS = ["Handgelenk", "Ellenbogen", "Schulter", "Rücken", "Knie", "Hand/Haut"];

  /* ------------------------ Helfer ------------------------ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmt(iso, long) {
    var p = iso.split("-");
    return p[2] + "." + p[1] + (long ? "." + p[0].slice(2) : "");
  }
  function setsStr(sets, unit) {
    return sets.filter(function (s) { return s !== null; }).join("/") + (unit === "sec" ? "s" : "");
  }
  function sum(sets) {
    return sets.reduce(function (a, v) { return a + (v || 0); }, 0);
  }

  /* ------------------------ State ------------------------ */
  var S = {
    data: null, loading: true, err: null, saving: false, toast: null,
    planId: "a", dayIdx: 0, view: "log", persistProven: false, date: null,
    entries: {}, energy: null, note: "", issues: [], issueNote: "", bw: "",
    openOpts: {}, openHist: {}
  };

  function plan() { return PLANS[S.planId]; }
  function day() { return plan().days[S.dayIdx]; }

  function blankForm() {
    var o = {};
    day().ex.forEach(function (ex) {
      o[ex.id] = { sets: new Array(ex.sets).fill(null), kg: null, variant: "", rpe: null };
    });
    return o;
  }

  function histByEx() {
    var map = {};
    if (!S.data) return map;
    // Nach Datum absteigend, damit Nachtraege korrekt einsortiert werden.
    var sorted = S.data.sessions.slice().sort(function (a, b) {
      if (a.date === b.date) return (b.id || 0) - (a.id || 0);
      return a.date < b.date ? 1 : -1;
    });
    // Nur Einheiten bis einschliesslich des gewaehlten Datums gelten als "vorher".
    var cutoff = S.date || todayISO();
    sorted = sorted.filter(function (s) { return s.date <= cutoff; });
    sorted.forEach(function (s) {
      s.exercises.forEach(function (e) {
        if (!e.sets.some(function (x) { return x !== null; })) return;
        (map[e.id] = map[e.id] || []).push({
          date: s.date, sets: e.sets, kg: e.kg, variant: e.variant
        });
      });
    });
    return map;
  }

  /* ---------------------- Persistenz ---------------------- */
  /* Speicher: localStorage des Browsers. In Safari zuverlaessig,
     ueberlebt Neustarts und funktioniert offline. */

  function emsg(e) {
    if (!e) return "unbekannter Fehler";
    return String(e.message || e).slice(0, 140);
  }

  function readStore() {
    var raw = window.localStorage.getItem(KEY);
    if (raw) {
      try { return JSON.parse(raw); }
      catch (e) { /* beschaedigt — unten auf die Kopie zurueckfallen */ }
    }
    var bak = window.localStorage.getItem(KEY + ":bak");
    if (bak) { try { return JSON.parse(bak); } catch (e2) { /* auch defekt */ } }
    return null;
  }

  function writeStore(obj) {
    var payload = JSON.stringify(obj);
    // Vorherigen Stand als Sicherheitskopie behalten, bevor ueberschrieben wird.
    try {
      var prev = window.localStorage.getItem(KEY);
      if (prev && prev !== payload) window.localStorage.setItem(KEY + ":bak", prev);
    } catch (e) { /* Kopie ist optional */ }
    window.localStorage.setItem(KEY, payload);
    if (window.localStorage.getItem(KEY) !== payload) throw new Error("Rueckgelesener Wert weicht ab");
    return true;
  }

  async function load() {
    try {
      var d = readStore();
      S.data = d || { sessions: [], weights: [] };
      S.storageOk = true;
      S.persistProven = !!d;
    } catch (e) {
      S.data = { sessions: [], weights: [] };
      S.storageOk = false;
      S.err = "Der Browser-Speicher ist nicht verfuegbar (" + emsg(e) +
        "). Im privaten Modus von Safari ist das normal — oeffne die Datei in einem normalen Tab.";
    }
    if (!S.data || !Array.isArray(S.data.sessions)) S.data = { sessions: [], weights: [] };
    if (!Array.isArray(S.data.weights)) S.data.weights = [];
    S.loading = false;
    S.entries = blankForm();
    render();
  }

  async function persist(next) {
    S.saving = true; S.err = null;
    S.data = next;
    try {
      writeStore(next);
      S.storageOk = true; S.persistProven = true;
    } catch (e) {
      S.storageOk = false;
      S.err = "Speichern fehlgeschlagen (" + emsg(e) +
        "). Die Einheit ist in dieser Sitzung erhalten — sichere sie ueber Verlauf > Sicherung.";
    }
    S.saving = false;
    return true;
  }

  async function retry() {
    if (!S.data) return;
    S.err = null; S.saving = true; render();
    try {
      writeStore(S.data);
      S.storageOk = true; S.persistProven = true; S.saving = false;
      flash("Jetzt gesichert");
    } catch (e) {
      S.storageOk = false; S.saving = false;
      S.err = "Weiterhin kein Speicherzugriff (" + emsg(e) + "). Nutze Verlauf > Sicherung.";
      render();
    }
  }

  /* Sicherung als Datei herunterladen bzw. wieder einlesen */
  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  async function importJSON(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { flash("Kein gueltiges JSON"); return; }
    if (!obj || !Array.isArray(obj.sessions)) { flash("Datei passt nicht zum Format"); return; }
    if (!Array.isArray(obj.weights)) obj.weights = [];
    // Zusammenfuehren statt ersetzen: bestehende IDs bleiben erhalten.
    function fingerprint(x) {
      return [x.id, x.date, x.dayId].join("|");
    }
    var ids = {};
    S.data.sessions.forEach(function (s) { ids[fingerprint(s)] = true; });
    var added = 0;
    obj.sessions.forEach(function (s) {
      if (!s || !Array.isArray(s.exercises)) return;
      if (s.id == null) s.id = Date.now() + Math.floor(Math.random() * 1000);
      if (ids[fingerprint(s)]) return;
      S.data.sessions.push(s);
      ids[fingerprint(s)] = true;
      added++;
    });
    var wd = {};
    S.data.weights.forEach(function (w) { wd[w.date] = true; });
    obj.weights.forEach(function (w) { if (!wd[w.date]) S.data.weights.push(w); });
    await persist(S.data);
    flash(added + " Einheit" + (added === 1 ? "" : "en") + " uebernommen");
  }

  function flash(msg) {
    S.toast = msg;
    render();
    setTimeout(function () { S.toast = null; render(); }, 2200);
  }

  async function saveSession() {
    var d = day();
    var session = {
      id: Date.now(), date: S.date || todayISO(), planId: S.planId, dayId: d.id, dayName: d.name,
      energy: S.energy, note: S.note.trim(),
      issues: S.issues.length ? { parts: S.issues.slice(), note: S.issueNote.trim() } : null,
      exercises: d.ex.map(function (ex) {
        var e = S.entries[ex.id];
        return { id: ex.id, name: ex.name, unit: ex.unit, warmup: ex.warmup,
                 sets: e.sets.slice(), kg: e.kg, variant: e.variant, rpe: e.rpe };
      }).filter(function (e) { return e.sets.some(function (s) { return s !== null; }); })
    };
    var next = { sessions: S.data.sessions.concat([session]), weights: S.data.weights };
    if (await persist(next)) {
      S.entries = blankForm(); S.energy = null; S.note = ""; S.issues = []; S.issueNote = "";
      S.openOpts = {}; S.openHist = {}; S.date = null;
      flash(S.storageOk === true ? "Einheit gespeichert" : "Einheit erfasst — siehe Hinweis oben");
    } else { render(); }
  }

  async function saveWeight() {
    var v = Number(S.bw);
    if (!v) return;
    var d = S.date || todayISO();
    var next = {
      sessions: S.data.sessions,
      weights: S.data.weights.filter(function (w) { return w.date !== d; })
                 .concat([{ date: d, kg: v }])
    };
    if (await persist(next)) {
      S.bw = "";
      flash(S.storageOk === true ? "Körpergewicht gespeichert" : "Erfasst — siehe Hinweis oben");
    } else { render(); }
  }

  function csv() {
    var rows = ["datum,tag,uebung,satz,wert,einheit,zusatz_kg,variante,rpe,energie,beschwerden,notiz"];
    S.data.sessions.forEach(function (s) {
      s.exercises.forEach(function (e) {
        e.sets.forEach(function (val, i) {
          if (val === null) return;
          rows.push([s.date, s.dayId, e.id, i + 1, val, e.unit, e.kg == null ? "" : e.kg,
            '"' + String(e.variant || "").replace(/"/g, "") + '"', e.rpe == null ? "" : e.rpe,
            s.energy == null ? "" : s.energy,
            '"' + (s.issues ? s.issues.parts.join("|") + " " + s.issues.note : "") + '"',
            '"' + String(s.note || "").replace(/"/g, "") + '"'].join(","));
        });
      });
    });
    S.data.weights.forEach(function (w) {
      rows.push(w.date + ",koerpergewicht,,," + w.kg + ",kg,,,,,,");
    });
    return rows.join("\n");
  }

  /* ------------------------ Render ------------------------ */
  function exerciseCard(ex, hist) {
    var e = S.entries[ex.id] || { sets: [], kg: null, variant: "", rpe: null };
    var last = hist[0] || null;
    var isTotal = !!ex.total;
    var cur = sum(e.sets);
    var doneN = e.sets.filter(function (s) { return s !== null; }).length;
    var lastSum = last ? sum(last.sets) : 0;

    var ready = !ex.warmup && last && (isTotal
      ? lastSum >= ex.total[1]
      : last.sets.filter(function (s) { return s !== null; }).length >= ex.sets &&
        last.sets.filter(function (s) { return s !== null; }).every(function (s) { return s >= ex.max; }));

    var goal = isTotal
      ? "Ziel " + (ex.total[0] === ex.total[1] ? ex.total[0] + " s gesamt" : ex.total[0] + "–" + ex.total[1] + " s gesamt")
      : "Ziel " + ex.sets + " × " + ex.min + "–" + ex.max +
        (ex.unit === "sec" ? "s" : ex.unit === "side" ? " pro Bein" : "");

    var countCls = isTotal ? (cur >= ex.total[0] ? "full" : cur > 0 ? "part" : "")
                           : (doneN === ex.sets ? "full" : doneN > 0 ? "part" : "");
    var countTxt = isTotal ? cur + " s" : doneN + "/" + ex.sets;

    var h = '<div class="card' + (ex.warmup ? " warm" : "") + '"><div class="pad">';
    h += '<div class="exhead"><div style="min-width:0">';
    if (ex.warmup) h += '<span class="eyebrow">Aufwärmen · locker</span>';
    h += '<h3 class="exname">' + esc(ex.name) + '</h3></div>';
    h += '<span class="count ' + countCls + ' mono" id="cnt_' + ex.id + '">' + countTxt + '</span></div>';

    h += '<div class="marks"><span class="goal">' + esc(goal) + '</span>';
    if (last) {
      h += '<button class="lastbtn" data-act="hist" data-ex="' + ex.id + '">letztes Mal <b class="mono">' +
        esc(setsStr(last.sets, ex.unit)) + '</b>' + (last.kg ? " +" + last.kg + "kg" : "") +
        ' <span class="d">· ' + fmt(last.date) + '</span> ' + (S.openHist[ex.id] ? "▲" : "▼") + '</button>';
    } else {
      h += '<span class="nolast">noch kein Vorwert</span>';
    }
    h += '</div>';

    if (S.openHist[ex.id] && hist.length) {
      h += '<div class="hist">';
      hist.slice(0, 3).forEach(function (x) {
        h += '<div><span class="l">' + fmt(x.date, true) +
          (x.variant ? " · " + esc(x.variant) : "") + '</span>' +
          '<span class="r mono">' + esc(setsStr(x.sets, ex.unit)) + (x.kg ? " +" + x.kg : "") + '</span></div>';
      });
      h += '</div>';
    }

    if (ready) {
      h += '<div class="prog">↑ ' + (isTotal
        ? "Haltezeit erreicht — jetzt längere Sätze statt mehr Sätze"
        : "Letztes Mal überall am oberen Ende — heute steigern oder erschweren") + '</div>';
    }

    if (isTotal) {
      h += '<p class="hint">So viele Sätze wie nötig — Satz beenden, sobald die Linie bricht, nicht wenn die Zeit um ist.</p>';
    }

    h += '<div class="sets">';
    for (var i = 0; i < ex.sets; i++) {
      var v = e.sets[i];
      var ghost = last && last.sets[i] != null ? last.sets[i] : null;
      var empty = v === null || v === undefined;
      var beat = !empty && ghost !== null && v > ghost;
      var shown = empty ? (ghost === null ? "–" : ghost) : v;
      h += '<div class="setrow"><span class="setno mono">' + (i + 1) + '</span>' +
        '<div class="step">' +
        '<button data-act="dec" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="weniger">−</button>' +
        '<input class="val mono' + (beat ? " beat" : "") + '" type="number" inputmode="numeric" ' +
        'pattern="[0-9]*" min="0" step="1" enterkeyhint="done" ' +
        'id="s_' + ex.id + '_' + i + '" data-fld="set" data-ex="' + ex.id + '" data-i="' + i + '" ' +
        'value="' + (empty ? "" : v) + '" placeholder="' + (ghost === null ? "–" : ghost) + '" ' +
        'aria-label="Satz ' + (i + 1) + '">' +
        (ex.unit === "sec" ? '<span class="unit">s</span>' : "") +
        '<button data-act="inc" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="mehr">+</button></div>' +
        '<button class="clr" data-act="clr" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="zurücksetzen"' +
        (empty ? ' style="visibility:hidden"' : '') + '>×</button>' +
        '</div>';
    }
    h += '</div></div>';

    if (!ex.warmup) {
      var summary = [];
      if (e.kg) summary.push("+" + e.kg + " kg");
      if (e.variant) summary.push(e.variant);
      if (e.rpe) summary.push("RPE " + e.rpe);
      h += '<button class="opts" data-act="opts" data-ex="' + ex.id + '"><span>' +
        (summary.length ? esc(summary.join("  ·  ")) : "Gewicht, Variante, RPE") +
        '</span><span style="color:#94a3b8">' + (S.openOpts[ex.id] ? "▲" : "▼") + '</span></button>';

      if (S.openOpts[ex.id]) {
        h += '<div class="optbody">';
        h += '<div class="fld"><label>Zusatzgewicht</label>' +
          '<input type="number" inputmode="decimal" step="0.5" placeholder="0" value="' +
          (e.kg == null ? "" : e.kg) + '" data-fld="kg" data-ex="' + ex.id + '"><span style="font-size:12px;color:#94a3b8">kg</span></div>';
        if (ex.variants.length) {
          h += '<div class="tags">';
          ex.variants.forEach(function (v) {
            h += '<button class="tag' + (e.variant === v ? " on" : "") + '" data-act="var" data-ex="' +
              ex.id + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
          });
          h += '</div>';
        }
        h += '<input type="text" placeholder="eigene Variante / Anmerkung" value="' + esc(e.variant) +
          '" data-fld="variant" data-ex="' + ex.id + '">';
        h += '<div class="fld"><label>RPE</label><div class="num">';
        [6, 7, 8, 9, 10].forEach(function (r) {
          h += '<button class="' + (e.rpe === r ? "on" : "") + '" data-act="rpe" data-ex="' + ex.id +
            '" data-r="' + r + '">' + r + '</button>';
        });
        h += '</div></div></div>';
      }
    }
    h += '</div>';
    return h;
  }

  /* Nach Tastatureingaben nur die betroffenen Anzeigen nachziehen —
     ein kompletter Neuaufbau wuerde den Fokus aus dem Feld werfen. */
  function syncCounters(exId) {
    var d = day();
    var ex = null;
    for (var k = 0; k < d.ex.length; k++) if (d.ex[k].id === exId) ex = d.ex[k];
    if (!ex) return;
    var e = S.entries[exId];
    if (!e) return;

    var badge = document.getElementById("cnt_" + exId);
    if (badge) {
      var isTotal = !!ex.total;
      var cur = e.sets.reduce(function (a, v) { return a + (v || 0); }, 0);
      var doneN = e.sets.filter(function (x) { return x !== null; }).length;
      badge.textContent = isTotal ? cur + " s" : doneN + "/" + ex.sets;
      var full = isTotal ? cur >= ex.total[0] : doneN === ex.sets;
      var part = isTotal ? cur > 0 : doneN > 0;
      badge.className = "count mono" + (full ? " full" : part ? " part" : "");
    }

    var hist = histByEx()[exId] || [];
    var last = hist[0] || null;
    for (var i = 0; i < ex.sets; i++) {
      var inp = document.getElementById("s_" + exId + "_" + i);
      if (!inp) continue;
      var val = e.sets[i];
      var ghost = last && last.sets[i] != null ? last.sets[i] : null;
      var beat = val !== null && ghost !== null && val > ghost;
      inp.className = "val mono" + (beat ? " beat" : "");
      var x = inp.parentNode.parentNode.querySelector(".clr");
      if (x) x.style.visibility = val === null ? "hidden" : "visible";
    }

    var btn = document.querySelector('[data-act="save"]');
    if (btn) {
      var filled = Object.keys(S.entries).some(function (k2) {
        return S.entries[k2].sets.some(function (x2) { return x2 !== null; });
      });
      if (filled && !S.saving) {
        btn.removeAttribute("disabled");
        btn.textContent = "Einheit speichern";
      } else {
        btn.setAttribute("disabled", "");
        btn.textContent = S.saving ? "Speichert…" : "Noch kein Satz erfasst";
      }
    }
  }

  function render() {
    var root = document.getElementById("root");
    if (S.loading) {
      root.innerHTML = '<div style="padding:60px 0;text-align:center;color:#94a3b8;font-size:14px">Log wird geladen…</div>';
      return;
    }

    var stat = S.storageOk === true
      ? '<span class="stat ok">gesichert</span>'
      : S.storageOk === false
      ? '<span class="stat bad">nicht gesichert</span>'
      : S.data && S.data.sessions.length
      ? '<span class="stat warn">unbestätigt</span>'
      : '';
    var h = '<div class="hdr"><div class="hdr-top"><h1>Trainingslog ' + stat + '</h1><span class="mono">' +
      fmt(todayISO(), true) + '</span></div><div class="row">';

      h += '<button class="chip-d' + (S.planId === id ? " on" : "") + '" data-act="plan" data-p="' + id + '">' +

    });
    h += '<span style="flex:1"></span><button class="chip-d" data-act="view">' +
      (S.view === "log" ? "Verlauf" : "Zurück") + '</button></div>';

    if (S.view === "log") {
      h += '<div class="days">';
      plan().days.forEach(function (d, i) {
        h += '<button class="day' + (S.dayIdx === i ? " on" : "") + '" data-act="day" data-i="' + i + '">' +
          esc(d.name) + '</button>';
      });
      h += '</div>';
    }
    h += '</div>';

    if (S.err) {
      h += '<div class="err">' + esc(S.err) +
        '<button class="tag" style="margin-top:8px;display:block" data-act="retry">Erneut sichern</button></div>';
    }

    h += '<main>';

    if (S.view === "log") {
      var dsel = S.date || todayISO();
      var isToday = dsel === todayISO();
      h += '<div class="card"><div class="simple"><span>Datum' +
        (isToday ? '' : '<span style="display:block;font-size:12px;color:#c2410c">Nachtrag</span>') +
        '</span><input type="date" value="' + dsel + '" max="' + todayISO() +
        '" data-fld="date" style="border:1px solid ' + (isToday ? '#cbd5e1' : '#fdba74') +
        ';border-radius:6px;padding:6px 10px;font-size:14px;background:' +
        (isToday ? '#fff' : '#fff7ed') + '"></div></div>';

      h += '<div class="card"><div class="simple"><span>Frische' + (isToday ? ' heute' : '') + '</span><div class="num">';
      [1, 2, 3, 4, 5].forEach(function (n) {
        h += '<button class="' + (S.energy === n ? "on" : "") + '" data-act="energy" data-n="' + n + '">' + n + '</button>';
      });
      h += '</div></div></div>';

      h += '<div class="card"><div class="pad"><p style="font-size:14px;color:#334155;margin:0 0 10px">Beschwerden?</p><div class="tags">';
      PARTS.forEach(function (p) {
        h += '<button class="tag warn' + (S.issues.indexOf(p) >= 0 ? " on" : "") + '" data-act="issue" data-p="' +
          esc(p) + '">' + esc(p) + '</button>';
      });
      h += '</div>';
      if (S.issues.length) {
        h += '<input type="text" style="margin-top:10px" placeholder="Wo genau, wie stark?" value="' +
          esc(S.issueNote) + '" data-fld="issueNote">';
      }
      h += '</div></div>';

      h += '<textarea rows="2" placeholder="Notiz zur Einheit" data-fld="note">' + esc(S.note) + '</textarea>';

      var lw = S.data.weights[S.data.weights.length - 1];
      h += '<div class="card"><div class="simple"><span style="flex:1">Körpergewicht' +
        (lw ? '<span style="display:block;font-size:12px;color:#94a3b8">zuletzt ' + lw.kg + ' kg · ' +
          fmt(lw.date, true) + '</span>' : "") + '</span>' +
        '<input type="number" inputmode="decimal" step="0.1" placeholder="kg" value="' + esc(S.bw) +
        '" data-fld="bw"><button class="tag" style="margin-left:8px" data-act="bw"' +
        (S.bw ? "" : " disabled") + '>Sichern</button></div></div>';
    } else {
      if (!S.data.sessions.length) {
        h += '<div class="empty"><p>Noch keine Einheit gespeichert.</p>' +
          '<button class="tag on" data-act="view">Erste Einheit loggen</button></div>';
      } else {
        S.data.sessions.slice().sort(function (a, b) {
          if (a.date === b.date) return (b.id || 0) - (a.id || 0);
          return a.date < b.date ? 1 : -1;
        }).forEach(function (s) {
          h += '<div class="card"><div class="pad">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline">' +
            '<span style="font-size:14px;font-weight:600">' + esc(s.dayName) + '</span>' +
            '<span class="mono" style="font-size:12px;color:#94a3b8">' + fmt(s.date, true) +

            '<div style="margin-top:8px">';
          s.exercises.forEach(function (e) {
            h += '<div class="sess"><span class="n' + (e.warmup ? " warm" : "") + '">' + esc(e.name) +
              (e.variant ? ' <span style="color:#94a3b8">· ' + esc(e.variant) + '</span>' : "") + '</span>' +
              '<span class="mono">' + esc(setsStr(e.sets, e.unit)) + (e.kg ? " +" + e.kg : "") + '</span></div>';
          });
          h += '</div>';
          if (s.energy || s.issues || s.note) {
            var m = [];
            if (s.energy) m.push("Frische " + s.energy + "/5");
            if (s.issues) m.push("⚠ " + s.issues.parts.join(", ") + " " + s.issues.note);
            if (s.note) m.push(s.note);
            h += '<p class="meta">' + esc(m.join("  ·  ")) + '</p>';
          }
          h += '</div></div>';
        });
        h += '<div class="card exp"><div class="pad">' +
          '<p style="font-size:14px;font-weight:600;margin:0">Export für Claude Code</p>' +
          '<p style="font-size:12px;color:#64748b;margin:2px 0 8px">CSV kopieren und als log.csv ablegen.</p>' +
          '<textarea rows="5" readonly data-act="selectall">' + esc(csv()) + '</textarea>' +
          '<p style="font-size:14px;font-weight:600;margin:14px 0 0">Sicherung</p>' +
          '<p style="font-size:12px;color:#64748b;margin:2px 0 8px">' +
          'Umzug auf ein anderes Gerät oder eine andere Adresse: hier kopieren, dort einfügen. ' +
          'Der Browser-Speicher wandert nicht von selbst mit.</p>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">' +
          '<button class="tag on" data-act="copy">Alles kopieren</button>' +
          '<button class="tag" data-act="dl-json">Als Datei laden</button>' +
          '<button class="tag" data-act="dl-csv">CSV laden</button></div>' +
          '<textarea rows="4" readonly id="bak-out" data-act="selectall">' + esc(JSON.stringify(S.data)) +
          '</textarea>' +
          '<p style="font-size:14px;font-weight:600;margin:14px 0 0">Sicherung einlesen</p>' +
          '<p style="font-size:12px;color:#64748b;margin:2px 0 6px">' +
          'Kopierten Text hier einfügen und übernehmen. Vorhandene Einheiten bleiben erhalten.</p>' +
          '<textarea rows="3" id="bak-in" placeholder="Sicherung hier einfügen"></textarea>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
          '<button class="tag on" data-act="imp-text">Text übernehmen</button>' +
          '<button class="tag" data-act="imp">Aus Datei</button></div>' +
          '</div></div>';
      }
    }

    h += '</main>';

    if (S.view === "log") {
      var filled = Object.keys(S.entries).some(function (k) {
        return S.entries[k].sets.some(function (s) { return s !== null; });
      });
      h += '<div class="savebar"><div class="inner"><button class="save" data-act="save"' +
        (filled && !S.saving ? "" : " disabled") + '>' +
        (S.saving ? "Speichert…" : filled ? "Einheit speichern" : "Noch kein Satz erfasst") +
        '</button></div></div>';
    }

    if (S.toast) h += '<div class="toast"><span>' + esc(S.toast) + '</span></div>';

    root.innerHTML = h;
  }

  /* ------------------------ Events ------------------------ */
  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var a = t.dataset.act, ex = t.dataset.ex;

    if (a === "plan") { S.planId = t.dataset.p; S.dayIdx = 0; S.entries = blankForm(); S.openOpts = {}; S.openHist = {}; }
    else if (a === "day") { S.dayIdx = +t.dataset.i; S.entries = blankForm(); S.openOpts = {}; S.openHist = {}; }
    else if (a === "view") { S.view = S.view === "log" ? "history" : "log"; }
    else if (a === "energy") { var n = +t.dataset.n; S.energy = S.energy === n ? null : n; }
    else if (a === "issue") { var p = t.dataset.p; var k = S.issues.indexOf(p);
      if (k >= 0) S.issues.splice(k, 1); else S.issues.push(p); }
    else if (a === "hist") { S.openHist[ex] = !S.openHist[ex]; }
    else if (a === "opts") { S.openOpts[ex] = !S.openOpts[ex]; }
    else if (a === "var") { var v = t.dataset.v; var e = S.entries[ex];
      e.variant = e.variant === v ? "" : v; }
    else if (a === "rpe") { var r = +t.dataset.r; var e2 = S.entries[ex];
      e2.rpe = e2.rpe === r ? null : r; }
    else if (a === "inc" || a === "dec" || a === "clr") {
      var i = +t.dataset.i, entry = S.entries[ex];
      var exDef = day().ex.filter(function (x) { return x.id === ex; })[0];
      var step = exDef.unit === "sec" ? 5 : 1;
      if (a === "clr") { entry.sets[i] = null; }
      else {
        var hist2 = histByEx()[ex] || [];
        var ghost2 = hist2[0] && hist2[0].sets[i] != null ? hist2[0].sets[i] : 0;
        var base = entry.sets[i] == null ? ghost2 : entry.sets[i];
        entry.sets[i] = a === "inc" ? base + step : Math.max(0, base - step);
      }
      var fld = document.getElementById("s_" + ex + "_" + i);
      if (fld) {
        fld.value = entry.sets[i] === null ? "" : entry.sets[i];
        syncCounters(ex);
        return; // ohne Neuaufbau, damit die Tastatur nicht springt
      }
    }
    else if (a === "retry") { retry(); return; }
    else if (a === "del") {
      var id = Number(t.dataset.id);
      if (S.confirmDel === id) {
        S.confirmDel = null;
        persist({ sessions: S.data.sessions.filter(function (x) { return x.id !== id; }),
                  weights: S.data.weights }).then(render);
        return;
      }
      S.confirmDel = id;
      flash("Nochmal tippen zum Löschen");
      return;
    }
    else if (a === "save") { saveSession(); return; }
    else if (a === "bw") { saveWeight(); return; }
    else if (a === "selectall") { t.select(); return; }
    else if (a === "copy") {
      var out = document.getElementById("bak-out");
      if (out) {
        out.select();
        out.setSelectionRange(0, 999999);
        var done = false;
        try { done = document.execCommand("copy"); } catch (e) { done = false; }
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(out.value).then(function () { flash("Kopiert"); },
            function () { flash("Bitte von Hand markieren und kopieren"); });
          return;
        }
        flash(done ? "Kopiert" : "Bitte von Hand markieren und kopieren");
      }
      return;
    }
    else if (a === "imp-text") {
      var inn = document.getElementById("bak-in");
      if (!inn || !inn.value.trim()) { flash("Kein Text eingefügt"); return; }
      importJSON(inn.value.trim()).then(render);
      return;
    }
    else if (a === "dl-json") {
      download("trainingslog-" + todayISO() + ".json", JSON.stringify(S.data, null, 2), "application/json");
      return;
    }
    else if (a === "dl-csv") {
      download("trainingslog-" + todayISO() + ".csv", csv(), "text/csv;charset=utf-8");
      return;
    }
    else if (a === "imp") {
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { importJSON(String(fr.result)).then(render); };
        fr.readAsText(f);
      };
      inp.click();
      return;
    }
    render();
  });

  /* Textfelder: State ohne Re-Render pflegen, damit der Fokus bleibt */
  document.addEventListener("input", function (ev) {
    var t = ev.target, f = t.dataset && t.dataset.fld;
    if (!f) return;
    if (f === "note") S.note = t.value;
    else if (f === "issueNote") S.issueNote = t.value;
    else if (f === "bw") {
      S.bw = t.value;
      var btn = document.querySelector('[data-act="bw"]');
      if (btn) { if (S.bw) btn.removeAttribute("disabled"); else btn.setAttribute("disabled", ""); }
    }
    else if (f === "set") {
      var eid = t.dataset.ex, idx = +t.dataset.i;
      var raw = t.value.replace(/[^0-9]/g, "");
      if (raw !== t.value) t.value = raw;
      S.entries[eid].sets[idx] = raw === "" ? null : Number(raw);
      syncCounters(eid);
    }
    else if (f === "date") { S.date = t.value || null; render(); }
    else if (f === "kg") S.entries[t.dataset.ex].kg = t.value === "" ? null : Number(t.value);
    else if (f === "variant") S.entries[t.dataset.ex].variant = t.value;
  });

  load();
})();

</script>
</body>
</html>
