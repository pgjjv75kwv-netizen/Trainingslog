<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="theme-color" content="#0a0b0d">
<title>Trainingslog</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f172a'/%3E%3Cg fill='none' stroke='%23f97316' stroke-width='13' stroke-linecap='round'%3E%3Cpath d='M40 90h100'/%3E%3Cpath d='M40 66v48M140 66v48'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; padding: 0; background: #0a0b0d; }
body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  background: radial-gradient(1200px 600px at 50% -200px, rgba(255,106,40,.14), transparent 60%), #0a0b0d; }

  #root, #root * { box-sizing: border-box; }
  #root {
    --bg: #0a0b0d; --card: #121418; --card2: #0e1013; --line: #1f2329; --line2: #2a2f37;
    --text: #eef0f3; --mute: #8b93a1; --dim: #5b626e;
    --hot: #ff6a28; --hot2: #ff3d6e; --lime: #b9ff3b; --amber: #ffc93c;
    --grad: linear-gradient(135deg, var(--hot), var(--hot2));
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text); max-width: 460px; margin: 0 auto; min-height: 100vh;
    padding-bottom: 170px; position: relative;
  }
  #root .mono { font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  #root button { font: inherit; cursor: pointer; border: none; background: none; color: inherit;
    -webkit-tap-highlight-color: transparent; transition: transform .08s ease, background .15s ease; }
  #root button:active { transform: scale(.96); }
  #root input, #root textarea { font: inherit; color: inherit; }
  #root input:focus-visible, #root button:focus-visible, #root textarea:focus-visible {
    outline: 2px solid var(--hot); outline-offset: 2px;
  }

  #root .hdr { position: sticky; top: 0; z-index: 20; padding: 18px 16px 14px;
    background: rgba(10,11,13,.78); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border-bottom: 1px solid var(--line); }
  #root .hdr-top { display: flex; justify-content: space-between; align-items: center; }
  #root .hdr-top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(90deg, #fff, #ffb38a); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #root .hdr-top > span { font-size: 13px; color: var(--mute); }
  #root .row { display: flex; gap: 6px; margin-top: 14px; align-items: center; }
  #root .chip-d { font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
    background: #16191e; color: #b7bfcb; border: 1px solid var(--line2); }
  #root .chip-d.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  #root .stat { font-size: 10px; letter-spacing: 0; font-weight: 700; padding: 3px 8px; border-radius: 999px;
    margin-left: 8px; vertical-align: 4px; -webkit-text-fill-color: initial; }
  #root .stat.ok { background: rgba(185,255,59,.12); color: var(--lime); }
  #root .stat.warn { background: rgba(255,201,60,.12); color: var(--amber); }
  #root .stat.bad { background: rgba(255,61,110,.14); color: #ff8aa8; }
  #root .days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 12px; overflow-x: auto; }
  #root .day { font-size: 14px; font-weight: 700; padding: 11px 8px; border-radius: 14px; text-align: center;
    border: 1px solid var(--line2); color: #b7bfcb; background: #14171b; }
  #root .day.on { background: var(--grad); border-color: transparent; color: #fff;
    box-shadow: 0 8px 26px rgba(255,90,50,.35); }
  #root .day .dran { display: block; font-size: 9px; font-weight: 800; letter-spacing: .12em;
    text-transform: uppercase; color: var(--lime); margin-top: 2px; }
  #root .day.on .dran { color: #fff; opacity: .9; }

  #root main { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  #root .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset; }
  #root .card.warm { border-style: dashed; border-color: var(--line2); background: transparent; }
  #root .pad { padding: 16px 16px 14px; }

  #root .exhead { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  #root .eyebrow { font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
    font-weight: 800; color: var(--dim); display: block; margin-bottom: 4px; }
  #root .exname { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
  #root .exvar { font-size: 12.5px; color: var(--mute); margin-top: 3px; }
  #root .count { flex: 0 0 auto; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px;
    background: #16191e; color: var(--dim); border: 1px solid var(--line2); }
  #root .count.part { color: var(--text); border-color: #3a404a; }
  #root .count.full { background: var(--lime); color: #0a0b0d; border-color: var(--lime);
    box-shadow: 0 0 18px rgba(185,255,59,.35); }

  #root .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
  #root .goal { font-size: 11.5px; font-weight: 600; background: #16191e; color: var(--mute);
    padding: 4px 9px; border-radius: 999px; }
  #root .lastbtn { font-size: 11.5px; font-weight: 600; background: rgba(255,106,40,.1); color: #ffb38a;
    border: 1px solid rgba(255,106,40,.3); padding: 4px 9px; border-radius: 999px; }
  #root .lastbtn b { font-weight: 800; color: #fff; }
  #root .lastbtn .d { color: #ff9a66; opacity: .8; }
  #root .best { font-size: 11.5px; font-weight: 600; background: rgba(185,255,59,.08); color: #d4ff8a;
    border: 1px solid rgba(185,255,59,.28); padding: 4px 9px; border-radius: 999px; }
  #root .best b { color: #fff; }
  #root .nolast { font-size: 11.5px; color: var(--dim); }
  #root .hint { font-size: 12px; color: var(--mute); margin: 10px 0 0; }
  #root .warnbox { margin-top: 12px; font-size: 12.5px; color: var(--amber); background: rgba(255,201,60,.07);
    border: 1px solid rgba(255,201,60,.3); border-radius: 14px; padding: 9px 11px; line-height: 1.45; }
  #root .editbox { font-size: 12.5px; color: #a9c7ff; background: rgba(80,140,255,.08);
    border: 1px solid rgba(80,140,255,.3); border-radius: 16px; padding: 12px 14px; line-height: 1.45; }
  #root .editbox b { color: #dbe7ff; }

  #root .hist { margin-top: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--card2); }
  #root .hist div { display: flex; justify-content: space-between; gap: 10px;
    padding: 8px 12px; font-size: 12px; border-top: 1px solid var(--line); }
  #root .hist div:first-child { border-top: none; }
  #root .hist .l { color: var(--mute); }
  #root .hist .r { color: var(--text); font-weight: 700; white-space: nowrap; }

  #root .prog { margin-top: 12px; font-size: 12px; font-weight: 700; color: #fff;
    background: var(--grad); border-radius: 12px; padding: 8px 11px; box-shadow: 0 6px 20px rgba(255,90,50,.25); }

  #root .sets { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  #root .setrow { display: flex; align-items: center; gap: 10px; }
  #root .setno { width: 18px; flex: 0 0 auto; font-size: 12px; font-weight: 800; color: var(--dim); text-align: center; }
  #root .setno.extra { color: var(--hot); }
  #root .step { flex: 1; display: flex; border: 1px solid var(--line2); border-radius: 16px;
    overflow: hidden; background: var(--card2); }
  #root .step button { width: 58px; flex: 0 0 auto; font-size: 26px; font-weight: 300; color: var(--mute); padding: 10px 0; }
  #root .step button:active { background: #1b1f25; color: #fff; }
  #root .val { flex: 1; min-width: 0; width: 100%; text-align: center; padding: 10px 0;
    border: none; background: transparent; font-size: 28px; font-weight: 800; line-height: 1.1;
    color: #fff; border-radius: 0; -moz-appearance: textfield; appearance: textfield; letter-spacing: -.02em; }
  #root .val::-webkit-outer-spin-button,
  #root .val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #root .val::placeholder { color: #343a44; opacity: 1; }
  #root .val.beat { color: var(--hot); text-shadow: 0 0 18px rgba(255,106,40,.55); }
  #root .unit { flex: 0 0 auto; align-self: center; font-size: 12px; font-weight: 700; color: var(--dim);
    margin-left: -20px; padding-right: 8px; pointer-events: none; }
  #root .clr { width: 30px; flex: 0 0 auto; color: #3a404a; font-size: 22px; }
  #root .addset { margin-top: 10px; width: 100%; padding: 11px; border: 1px dashed var(--line2);
    border-radius: 14px; font-size: 13px; font-weight: 700; color: var(--mute); }

  #root .opts { width: 100%; padding: 13px 16px; text-align: left; font-size: 12.5px; font-weight: 600; color: var(--mute);
    border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  #root .opts.pain { color: var(--amber); background: rgba(255,201,60,.05); }
  #root .optbody { padding: 8px 16px 18px; border-top: 1px solid var(--line); background: var(--card2);
    display: flex; flex-direction: column; gap: 14px; }
  #root .olabel { font-size: 10.5px; font-weight: 800; color: var(--dim); text-transform: uppercase;
    letter-spacing: .1em; margin: 6px 0 8px; }
  #root .ohint { font-size: 11.5px; color: var(--dim); margin: 6px 0 0; }
  #root .fld { display: flex; align-items: center; gap: 12px; }
  #root .fld label { font-size: 12.5px; color: var(--mute); width: 96px; flex: 0 0 auto; }
  #root input[type=number], #root input[type=text], #root input[type=date] {
    border: 1px solid var(--line2); border-radius: 12px; padding: 9px 12px; font-size: 15px;
    background: #16191e; color: var(--text); color-scheme: dark; }
  #root input[type=number] { width: 88px; }
  #root input[type=text] { width: 100%; }
  #root input::placeholder, #root textarea::placeholder { color: var(--dim); }
  #root .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  #root .tag { font-size: 13px; font-weight: 600; padding: 8px 13px; border-radius: 999px;
    border: 1px solid var(--line2); background: #16191e; color: #c3c9d3; }
  #root .tag.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  #root .tag.warn.on { background: var(--amber); color: #1a1400; border-color: var(--amber); }
  #root .tag[disabled] { opacity: .4; }
  #root .num { display: flex; gap: 6px; flex-wrap: wrap; }
  #root .num button { min-width: 44px; height: 42px; padding: 0 8px; border-radius: 12px;
    border: 1px solid var(--line2); background: #16191e; color: #c3c9d3; font-size: 15px; font-weight: 700; }
  #root .num button.on { background: var(--grad); color: #fff; border-color: transparent;
    box-shadow: 0 4px 16px rgba(255,90,50,.35); }
  #root .num.pain button { min-width: 36px; height: 38px; font-size: 13px; }
  #root .num.pain button.on { background: var(--amber); color: #1a1400; box-shadow: 0 4px 16px rgba(255,201,60,.3); }

  #root .simple { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; gap: 12px; }
  #root .simple > span { font-size: 15px; font-weight: 700; color: var(--text); }
  #root .energie .num { flex-wrap: nowrap; gap: 5px; }
  #root .energie .num button { min-width: 40px; }
  #root textarea { width: 100%; border: 1px solid var(--line); border-radius: 20px;
    padding: 14px 16px; font-size: 15px; resize: none; background: var(--card); color: var(--text); }

  #root .savebar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, #0a0b0d 72%, rgba(10,11,13,0)); z-index: 30; }
  #root .savebar .inner { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #root .save { width: 100%; padding: 17px; border-radius: 18px; font-size: 16px; font-weight: 800; letter-spacing: .01em;
    background: var(--grad); color: #fff; box-shadow: 0 10px 30px rgba(255,90,50,.35); }
  #root .save[disabled] { background: #16191e; color: #4a505a; box-shadow: none; border: 1px solid var(--line2); }
  #root .timer { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px;
    background: rgba(18,20,24,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,106,40,.45); color: #ffb38a; font-size: 13px; font-weight: 700;
    box-shadow: 0 0 30px rgba(255,106,40,.18); }
  #root .timer.done { border-color: rgba(185,255,59,.5); color: var(--lime); box-shadow: 0 0 30px rgba(185,255,59,.2); }
  #root .timer b { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: -.02em; }
  #root .timer .x { margin-left: auto; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 12px;
    background: #1b1f25; color: var(--text); border: 1px solid var(--line2); }
  #root .timer .bar { flex: 1; height: 6px; border-radius: 3px; background: #23272e; overflow: hidden; }
  #root .timer .bar i { display: block; height: 100%; background: var(--grad); border-radius: 3px; }

  #root .toast { position: fixed; bottom: 170px; left: 0; right: 0; display: flex; justify-content: center;
    pointer-events: none; z-index: 40; }
  #root .toast span { background: var(--text); color: var(--bg); font-size: 13px; font-weight: 700; padding: 10px 18px;
    border-radius: 999px; max-width: 90%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  #root .err { margin: 12px 16px 0; background: rgba(255,61,110,.1); border: 1px solid rgba(255,61,110,.35); color: #ff9ab4;
    font-size: 12.5px; padding: 10px 12px; border-radius: 14px; }
  #root .empty { border: 1px dashed var(--line2); border-radius: 20px; padding: 40px 16px; text-align: center; }
  #root .empty p { color: var(--mute); font-size: 14px; margin: 0 0 12px; }
  #root .sess { font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  #root .sess .n { color: #c3c9d3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #root .sess .n.warm { color: var(--dim); }
  #root .meta { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mute); }
  #root .exp textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px; line-height: 1.4; background: var(--card2); }
  #root .big { width: 100%; padding: 15px; border-radius: 16px; font-size: 15px; font-weight: 800;
    background: var(--grad); color: #fff; margin-top: 12px; box-shadow: 0 8px 24px rgba(255,90,50,.3); }
  #root p[style*="color:#334155"] { color: var(--text) !important; }
  #root p[style*="color:#64748b"], #root span[style*="color:#94a3b8"] { color: var(--mute) !important; }
  #root input.val { border: none; background: transparent; border-radius: 0; width: 100%; padding: 10px 0;
    font-size: 28px; font-weight: 800; color: #fff; }
  #root input.val.beat { color: var(--hot); }
  @media (prefers-reduced-motion: reduce) { #root * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script>

(function () {
  "use strict";

  /* ------------------------- Plan ------------------------- */
  /* Der Plan selbst ist unveraendert (Stand 15.08.2026, siehe Kontext-Prompt).
     Geaendert hat sich nur, wie Varianten erfasst werden (Version 2, 10/2026):
     Ausfuehrung, Geraet, Griff, Erhoehung und Band sind eigene Felder statt
     Freitext, damit Verlaeufe vergleichbar bleiben. */
  var V = {
    pull: ["normal", "negativ"],
    dip: ["normal", "negativ"],
    push: ["normal", "Pseudo-Planche"],
    pike: ["normal", "Wand-HSPU"],
    hs: ["frei", "Brust zur Wand", "Rücken zur Wand"],
    lever: ["Tuck", "Advanced Tuck", "One Leg"],
    bss: ["Bulgarian Split Squat", "einfache Squats"],
    squat: ["normal", "Tempo"],
    knie: ["Knie angezogen", "gestreckte Beine", "im Stütz"],
    knieStuetz: ["im Stütz", "hängend"],
    bein: ["hängend", "Knieheben im Stütz"],
    lsit: ["tucked", "einbeinig", "gestreckt"],
    hollow: ["normal", "Arme über Kopf", "Hollow Rocks"],
    none: []
  };

  /* Je Uebung: moegliche Geraete, ob Griff/Erhoehung/Band sinnvoll sind und
     die Standardpause in Sekunden (nur bei Abweichung aendern). */
  var ZUG = ["Stange", "Ringe"];
  var META = {
    scapula:    { geraet: ZUG, pause: 60 },
    lever:      { geraet: ZUG, pause: 120 },
    pullup:     { geraet: ZUG, griff: true, band: true, pause: 150 },
    pullup_neg: { geraet: ZUG, griff: true, band: true, pause: 150 },
    chinup:     { geraet: ZUG, griff: true, band: true, pause: 150 },
    row:        { geraet: ["Stange", "Ringe", "Tisch"], griff: true, erh: true, pause: 90 },
    pushup:     { geraet: ["Boden", "Bars", "Ringe"], erh: true, pause: 90 },
    hollow:     { pause: 60 },
    support:    { geraet: ["Bars", "Ringe"], pause: 60 },
    handstand:  { pause: 90 },
    dips:       { geraet: ["Bars", "Ringe", "Bank"], band: true, pause: 150 },
    pike:       { geraet: ["Boden", "Box"], erh: true, pause: 120 },
    bss:        { pause: 90 },
    knieheben:  { geraet: ["Stange", "Ringe", "Bars"], pause: 90 },
    squat:      { pause: 90 },
    hang:       { geraet: ZUG, griff: true, pause: 60 },
    beinheben:  { geraet: ["Stange", "Ringe", "Bars"], pause: 90 },
    lsit:       { geraet: ["Boden", "Bars", "Ringe"], pause: 90 }
  };
  var GRIFFE = ["Ober", "Unter", "neutral"];
  var PAUSEN = [60, 90, 120, 150, 180, 240];
  /* Clemens pausiert fast immer 3 Minuten (03.10.2026) -- deshalb ist das
     der Standard fuer jede Uebung. Abweichungen je Uebung in den Optionen. */
  var STANDARD_PAUSE = 180;
  var ORTE = ["Ellbogen li. innen", "Ellbogen li. außen", "Ellbogen re.", "Unterarm", "Handgelenk",
              "Schulter", "Nacken", "Rücken", "Oberschenkel", "Knie", "anderes"];
  var PARTS = ["Kopf", "Nacken", "Handgelenk", "Ellenbogen", "Schulter", "Rücken", "Oberschenkel", "Knie", "Hand/Haut"];

  function P(id, name, unit, sets, min, max, variants, warmup, total, pause) {
    return { id: id, name: name, unit: unit, sets: sets, min: min, max: max,
             variants: variants || V.none, warmup: !!warmup, total: total || null, pause: pause || null };
  }

  /* Plaene a und c: finale Fassung des Coaches, von Clemens am 03.10.2026
     bestaetigt. Grundlage "Kraft ohne Grenzen": Handstand -> Kraft-Skill ->
     Kraftuebungen -> Assistenz -> Core, Steuerung ueber RIR/SIR. Zielbereiche
     sind Orientierung. Scapula Pull-ups und Support Hold gehoeren zum
     Aufwaermen vor Ort und werden nicht mehr erfasst. */
  function Z(ex, rir, supersatz) { ex.rirZiel = rir || ""; ex.supersatz = supersatz || ""; return ex; }

  var PLANS = {
    c: { label: "2 Tage", days: [
      { id: "c1", name: "Ganzkörper A", ex: [
        Z(P("pullup", "Klimmzug", "reps", 5, 5, 8, V.pull), "RIR 1–2"),
        Z(P("dips", "Dips", "reps", 3, 6, 12, V.dip), "RIR 2–3"),
        Z(P("row", "Rudern", "reps", 3, 10, 12), "", "Liegestütze"),
        Z(P("pushup", "Liegestütze", "reps", 4, 10, 20, V.push), "", "Rudern"),
        P("squat", "Squats", "reps", 3, 12, 20, V.squat),
        P("lsit", "L-Sit", "sec", 3, 10, 20, V.lsit)
      ]},
      { id: "c2", name: "Ganzkörper B", ex: [
        Z(P("dips", "Dips", "reps", 5, 6, 12, V.dip), "RIR 1–2"),
        Z(P("chinup", "Chin-up (Untergriff)", "reps", 4, 5, 8, V.pull), "RIR 2–3"),
        Z(P("pushup", "Liegestütze", "reps", 4, 10, 20, V.push), "", "Bulgarian Split Squat"),
        Z(P("bss", "Bulgarian Split Squat", "side", 3, 8, 12, V.bss), "", "Liegestütze"),
        P("pike", "Pike Push-ups", "reps", 3, 6, 10, V.pike),
        P("beinheben", "Beinheben hängend", "reps", 3, 8, 12, V.bein)
      ]}
    ]},
    a: { label: "3 Tage", days: [
      { id: "a1", name: "Zug", ex: [
        Z(P("lever", "Tuck Front Lever (intensiv)", "sec", 4, 8, 10, V.lever), "SIR 1–2"),
        Z(P("pullup", "Klimmzug", "reps", 5, 5, 8, V.pull), "RIR 1–2"),
        Z(P("row", "Rudern", "reps", 3, 10, 12), "RIR 1–2", "Liegestütze"),
        Z(P("pushup", "Liegestütze", "reps", 4, 10, 20, V.push), "RIR 2", "Rudern"),
        Z(P("squat", "Squats", "reps", 3, 12, 20, V.squat), "RIR 2"),
        Z(P("beinheben", "Beinheben hängend", "reps", 3, 8, 12, V.bein), "RIR 2")

  };

  var KEY = "calisthenics:data";          // NICHT aendern: daran haengen alle Einheiten
  var DRAFT_KEY = KEY + ":draft";
  var EXPORT_KEY = KEY + ":lastExport";

  function meta(ex) { return META[ex.id] || {}; }
  function defaultGriff(ex) {
    if (!meta(ex).griff) return "";
    return /chin|unter/i.test(ex.name) ? "Unter" : "Ober";
  }

  /* ------------------------ Helfer ------------------------ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function fmt(iso, long) {
    var p = iso.split("-");
    return p[2] + "." + p[1] + (long ? "." + p[0].slice(2) : "");
  }
  function setsStr(sets, unit) {
    return sets.filter(function (s) { return s !== null && s !== undefined; }).join("/") + (unit === "sec" ? "s" : "");
  }
  function sum(sets) {
    return sets.reduce(function (a, v) { return a + (v || 0); }, 0);
  }
  function filledSets(sets) {
    return sets.filter(function (s) { return s !== null && s !== undefined; });
  }
  function mmss(s) {
    s = Math.max(0, Math.round(s));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  /* Reserve (RIR bzw. SIR) -> RPE, damit alte RPE-Eintraege und die Regel
     "harter Tag ab RPE-Median 8" weiter gelten: RPE = 10 - RIR. Bei
     Halteuebungen entsprechen etwa 3 Sekunden einer Wiederholung. */
  var SIR_STUFEN = [0, 3, 6, 10, 15];
  function rpeAusReserve(unit, r) {
    if (r === null || r === undefined) return null;
    if (unit === "sec") return { 0: 10, 3: 9, 6: 8, 10: 7, 15: 6 }[r] || null;
    return 10 - Math.min(r, 4);
  }
  function reserveText(unit, r) {
    if (r === null || r === undefined) return "";
    if (unit === "sec") return "SIR " + (r >= 15 ? "mehr" : r + " s");
    return "RIR " + (r >= 4 ? "4+" : r);
  }

  /* Ausfuehrung als lesbarer Text, landet im Export in der Spalte "variante" */
  function beschreibung(e) {
    return [e.ausf, e.geraet, e.griff ? e.griff + "griff" : "",
            e.erh ? "Erhöhung Stufe " + e.erh : "", e.band ? "mit Band" : "",
            e.variant].filter(Boolean).join(" · ");
  }
  /* Schluessel fuer "dieselbe Variante": nur Eintraege mit gleichem Schluessel
     werden fuer letztes Mal und Bestwert verglichen. */
  function variantKey(e) {
    if (!e.v2) return "alt|" + (e.variant || "");
    return [e.ausf || "", e.geraet || "", e.griff || "", e.erh || 0, e.band ? 1 : 0, e.kg ? "kg" : ""].join("|");
  }

  /* ------------------------ State ------------------------ */
  var S = {
    data: null, loading: true, err: null, saving: false, toast: null,
    planId: "a", dayIdx: 0, view: "log", persistProven: false, date: null,
    entries: {}, energy: null, note: "", issues: [], issueNote: "", bw: "",
    openOpts: {}, openHist: {}, editId: null, dirty: false,
    confirmSwitch: null, confirmSave: false, timer: null
  };

  function plan() { return PLANS[S.planId]; }
  function day() { return plan().days[S.dayIdx]; }

  function sortedSessions() {
    return S.data.sessions.slice().sort(function (a, b) {
      if (a.date === b.date) return (b.id || 0) - (a.id || 0);
      return a.date < b.date ? 1 : -1;
    });
  }

  /* Welcher Tag laut Rotation dran ist: der nach der letzten Einheit dieses Plans */
  function rotationIdx() {
    var days = plan().days;
    var ids = days.map(function (d) { return d.id; });
    var last = sortedSessions().filter(function (s) { return ids.indexOf(s.dayId) >= 0; })[0];
    if (!last) return 0;
    return (ids.indexOf(last.dayId) + 1) % days.length;
  }

  function histByEx(ausserId) {
    var map = {};
    if (!S.data) return map;
    var cutoff = S.date || todayISO();
    sortedSessions().filter(function (s) { return s.date <= cutoff && s.id !== ausserId; })
      .forEach(function (s) {
        s.exercises.forEach(function (e) {
          if (!filledSets(e.sets).length) return;
          // knieheben (alte Plaene, 4-Tage-Plan) und beinheben teilen den Verlauf
          var ids = e.id === "knieheben" ? ["knieheben", "beinheben"]
                  : e.id === "beinheben" ? ["beinheben", "knieheben"] : [e.id];
          var eintrag = {
            date: s.date, dayId: s.dayId, sets: e.sets, kg: e.kg, key: variantKey(e), text: beschreibung(e) || e.variant || "",
            schmerz: e.schmerz || null, ort: e.ort || "", ausf: e.ausf, geraet: e.geraet, griff: e.griff,
            erh: e.erh, band: e.band, v2: e.v2
          };
          ids.forEach(function (hid) { (map[hid] = map[hid] || []).push(eintrag); });
        });
      });
    return map;
  }

  function blankEntry(ex, hist) {
    var m = meta(ex);
    // Zuletzt genutzte Ausfuehrung vorbelegen -- nur Struktur, keine Werte.
    // Vom selben Trainingstag: a1 zieht im Obergriff, a3 im Chin-up-Griff.
    var dayId = day().id;
    var l = (hist || []).filter(function (x) { return x.v2 && x.dayId === dayId; })[0];
    return {
      v2: true, sets: new Array(ex.sets).fill(null), kg: null, variant: "",
      ausf: l ? l.ausf || "" : (ex.variants[0] || ""),
      geraet: l ? l.geraet || "" : (m.geraet ? m.geraet[0] : ""),
      griff: l ? l.griff || "" : defaultGriff(ex),
      erh: l ? l.erh || 0 : 0, band: l ? !!l.band : false,
      rir: null, pause: STANDARD_PAUSE, schmerz: null, ort: ""
    };
  }

  function blankForm() {
    var o = {}, hist = histByEx();
    day().ex.forEach(function (ex) { o[ex.id] = blankEntry(ex, hist[ex.id]); });
    return o;
  }

  /* Gespeicherte Einheit ins Formular laden (Nachtrag bzw. Bearbeiten) */
  function fillFromSession(s) {
    var hist = histByEx(s.id);
    var o = {};
    day().ex.forEach(function (ex) {
      var e = blankEntry(ex, hist[ex.id]);
      var g = s.exercises.filter(function (x) { return x.id === ex.id; })[0];
      if (g) {
        var sets = g.sets.slice();
        while (sets.length < ex.sets) sets.push(null);
        e.sets = sets; e.kg = g.kg == null ? null : g.kg;
        if (g.v2) {
          ["ausf", "geraet", "griff", "erh", "band", "rir", "pause", "schmerz", "ort", "variant"].forEach(function (k) {
            if (g[k] !== undefined) e[k] = g[k];
          });
        } else {
          // Alt-Eintrag: Freitext-Variante behalten, Strukturfelder leer lassen
          e.v2 = false;
          e.variant = g.variant || ""; e.ausf = ""; e.geraet = ""; e.griff = ""; e.erh = 0; e.band = false;
          e.rpeAlt = g.rpe == null ? null : g.rpe;
        }
      }
      o[ex.id] = e;
    });
    S.entries = o; S.energy = s.energy == null ? null : s.energy; S.note = s.note || "";
    S.issues = s.issues ? s.issues.parts.slice() : []; S.issueNote = s.issues ? s.issues.note || "" : "";
    S.editId = s.id; S.date = s.date; S.dirty = false;
  }

  function resetForm() {
    S.entries = blankForm(); S.energy = null; S.note = ""; S.issues = []; S.issueNote = "";
    S.openOpts = {}; S.openHist = {}; S.editId = null; S.dirty = false; S.confirmSave = false;
  }

  /* Gibt es fuer Datum + Tag schon eine Einheit, wird sie geladen statt eine
     zweite anzulegen. So entstehen keine doppelten Einheiten mehr (08.09.2026). */
  function loadExistingOrBlank() {
    var d = S.date || todayISO(), dayId = day().id;
    var s = sortedSessions().filter(function (x) { return x.date === d && x.dayId === dayId; })[0];
    S.openOpts = {}; S.openHist = {}; S.confirmSave = false;
    if (s) fillFromSession(s); else resetForm();
  }

  function formFilled() {
    return Object.keys(S.entries).some(function (k) { return filledSets(S.entries[k].sets).length > 0; });
  }

  /* ---------------------- Persistenz ---------------------- */
  function emsg(e) {
    if (!e) return "unbekannter Fehler";
    return String(e.message || e).slice(0, 140);
  }

  function readStore() {
    var raw = window.localStorage.getItem(KEY);
    if (raw) {
      try { return JSON.parse(raw); }
      catch (e) { /* beschaedigt — unten auf die Kopie zurueckfallen */ }
    }
    var bak = window.localStorage.getItem(KEY + ":bak");
    if (bak) { try { return JSON.parse(bak); } catch (e2) { /* auch defekt */ } }
    return null;
  }

  function writeStore(obj) {
    var payload = JSON.stringify(obj);
    try {
      var prev = window.localStorage.getItem(KEY);
      if (prev && prev !== payload) window.localStorage.setItem(KEY + ":bak", prev);
    } catch (e) { /* Kopie ist optional */ }
    window.localStorage.setItem(KEY, payload);
    if (window.localStorage.getItem(KEY) !== payload) throw new Error("Rueckgelesener Wert weicht ab");
    return true;
  }

  /* Entwurf: jede Eingabe sofort sichern. Schliesst iOS die App mitten im
     Training, ist beim naechsten Oeffnen alles wieder da (08.09.2026: von drei
     Saetzen Beinheben war nur einer gespeichert). */
  function saveDraft() {
    if (!S.dirty) return;
    try {
      window.localStorage.setItem(DRAFT_KEY, JSON.stringify({
        planId: S.planId, dayIdx: S.dayIdx, date: S.date, entries: S.entries, energy: S.energy,
        note: S.note, issues: S.issues, issueNote: S.issueNote, editId: S.editId, at: Date.now()
      }));
    } catch (e) { /* Entwurf ist Komfort, kein Muss */ }
  }
  function clearDraft() {
    try { window.localStorage.removeItem(DRAFT_KEY); } catch (e) { /* egal */ }
  }
  function readDraft() {
    try {
      var d = JSON.parse(window.localStorage.getItem(DRAFT_KEY) || "null");
      if (!d || !d.entries || !PLANS[d.planId] || !PLANS[d.planId].days[d.dayIdx]) return null;
      return d;
    } catch (e) { return null; }
  }
  function markDirty() { S.dirty = true; S.confirmSave = false; saveDraft(); }

  async function load() {
    try {
      var d = readStore();
      S.data = d || { sessions: [], weights: [] };
      S.storageOk = true;
      S.persistProven = !!d;
    } catch (e) {
      S.data = { sessions: [], weights: [] };
      S.storageOk = false;
      S.err = "Der Browser-Speicher ist nicht verfuegbar (" + emsg(e) +
        "). Im privaten Modus von Safari ist das normal — oeffne die Datei in einem normalen Tab.";
    }
    if (!S.data || !Array.isArray(S.data.sessions)) S.data = { sessions: [], weights: [] };
    if (!Array.isArray(S.data.weights)) S.data.weights = [];
    S.loading = false;

    var dr = readDraft();
    if (dr) {
      S.planId = dr.planId; S.dayIdx = dr.dayIdx; S.date = dr.date || null;
      S.entries = blankForm();
      Object.keys(dr.entries).forEach(function (k) { if (S.entries[k]) S.entries[k] = dr.entries[k]; });
      S.energy = dr.energy; S.note = dr.note || ""; S.issues = dr.issues || []; S.issueNote = dr.issueNote || "";
      S.editId = dr.editId || null; S.dirty = true;
      render();
      flash("Entwurf wiederhergestellt");
      return;
    }
    var zuletzt = sortedSessions()[0];
    if (zuletzt && PLANS[zuletzt.planId]) S.planId = zuletzt.planId;
    S.dayIdx = rotationIdx();
    loadExistingOrBlank();
    render();
  }

  async function persist(next) {
    S.saving = true; S.err = null;
    S.data = next;
    try {
      writeStore(next);
      S.storageOk = true; S.persistProven = true;
    } catch (e) {
      S.storageOk = false;
      S.err = "Speichern fehlgeschlagen (" + emsg(e) +
        "). Die Einheit ist in dieser Sitzung erhalten — sichere sie ueber Verlauf > Sicherung.";
    }
    S.saving = false;
    return true;
  }

  async function retry() {
    if (!S.data) return;
    S.err = null; S.saving = true; render();
    try {
      writeStore(S.data);
      S.storageOk = true; S.persistProven = true; S.saving = false;
      flash("Jetzt gesichert");
    } catch (e) {
      S.storageOk = false; S.saving = false;
      S.err = "Weiterhin kein Speicherzugriff (" + emsg(e) + "). Nutze Verlauf > Sicherung.";
      render();
    }
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }

  /* Export ueber das Teilen-Menue von iOS: "In Dateien sichern" ->
     iCloud Drive/Garmin/Logbuch. Der Mac uebernimmt die Datei beim Sync. */
  async function shareExport() {
    var name = "trainingslog-" + todayISO() + ".csv";
    var text = csv();
    try {
      var file = new File([text], name, { type: "text/csv" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        try { window.localStorage.setItem(EXPORT_KEY, todayISO()); } catch (e) { /* egal */ }
        flash("Gesendet");
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return;   // im Menue abgebrochen
    }
    download(name, text, "text/csv;charset=utf-8");
    try { window.localStorage.setItem(EXPORT_KEY, todayISO()); } catch (e) { /* egal */ }
  }

  async function importJSON(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { flash("Kein gueltiges JSON"); return; }
    if (!obj || !Array.isArray(obj.sessions)) { flash("Datei passt nicht zum Format"); return; }
    if (!Array.isArray(obj.weights)) obj.weights = [];
    function fingerprint(x) {
      return [x.id, x.date, x.dayId].join("|");
    }
    var ids = {};
    S.data.sessions.forEach(function (s) { ids[fingerprint(s)] = true; });
    var added = 0;
    obj.sessions.forEach(function (s) {
      if (!s || !Array.isArray(s.exercises)) return;
      if (s.id == null) s.id = Date.now() + Math.floor(Math.random() * 1000);
      if (ids[fingerprint(s)]) return;
      S.data.sessions.push(s);
      ids[fingerprint(s)] = true;
      added++;
    });
    var wd = {};
    S.data.weights.forEach(function (w) { wd[w.date] = true; });
    obj.weights.forEach(function (w) { if (!wd[w.date]) S.data.weights.push(w); });
    await persist(S.data);
    flash(added + " Einheit" + (added === 1 ? "" : "en") + " uebernommen");
  }

  var toastTimer = null;
  function flash(msg) {
    S.toast = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { S.toast = null; render(); }, 2600);
  }

  async function saveSession() {
    var d = day();
    // RIR fehlt? Einmal erinnern -- ohne Reserve greift die Regel fuer harte Tage nicht.
    var fehlt = d.ex.filter(function (ex) {
      var e = S.entries[ex.id];
      return !ex.warmup && filledSets(e.sets).length && (e.rir === null || e.rir === undefined) && e.rpeAlt == null;
    }).map(function (ex) { return ex.name.split(" (")[0]; });
    if (fehlt.length && !S.confirmSave) {
      S.confirmSave = true;
      flash("Reserve fehlt: " + fehlt.join(", ") + " — nochmal tippen speichert trotzdem");
      return;
    }
    var id = S.editId || Date.now();
    var session = {
      id: id, v: 2, date: S.date || todayISO(), planId: S.planId, dayId: d.id, dayName: d.name,
      energy: S.energy, note: S.note.trim(),
      issues: S.issues.length ? { parts: S.issues.slice(), note: S.issueNote.trim() } : null,
      exercises: d.ex.map(function (ex) {
        var e = S.entries[ex.id];
        var sets = e.sets.slice();
        while (sets.length > ex.sets && sets[sets.length - 1] === null) sets.pop();
        var out = { id: ex.id, name: ex.name, unit: ex.unit, warmup: ex.warmup, sets: sets, kg: e.kg,
                    variant: e.variant || "" };
        if (e.v2) {
          out.v2 = true;
          ["ausf", "geraet", "griff", "erh", "band", "rir", "pause", "schmerz", "ort"].forEach(function (k) { out[k] = e[k]; });
          out.rpe = rpeAusReserve(ex.unit, e.rir);
        } else {
          out.rpe = e.rpeAlt == null ? null : e.rpeAlt;
        }
        return out;
      }).filter(function (e) { return filledSets(e.sets).length > 0; })
    };
    var next = { sessions: S.data.sessions.filter(function (x) { return x.id !== id; }).concat([session]),
                 weights: S.data.weights };
    var warEdit = !!S.editId;
    if (await persist(next)) {
      clearDraft();
      S.timer = null; S.date = null;
      S.dayIdx = rotationIdx();
      loadExistingOrBlank();
      flash(S.storageOk === true ? (warEdit ? "Einheit aktualisiert" : "Einheit gespeichert")
                                 : "Einheit erfasst — siehe Hinweis oben");
    } else { render(); }
  }

  async function saveWeight() {
    var v = Number(String(S.bw).replace(",", "."));
    if (!v) return;
    var d = todayISO();
    var next = {
      sessions: S.data.sessions,
      weights: S.data.weights.filter(function (w) { return w.date !== d; })
                 .concat([{ date: d, kg: v }])
    };
    if (await persist(next)) {
      S.bw = "";
      flash(S.storageOk === true ? "Körpergewicht gespeichert" : "Erfasst — siehe Hinweis oben");
    } else { render(); }
  }

  /* Export: die ersten zwoelf Spalten wie bisher, neue Spalten hinten dran --
     der Mac liest nach Spaltennamen, alte Exporte bleiben lesbar. */
  var CSV_HEAD = ["datum", "tag", "uebung", "satz", "wert", "einheit", "zusatz_kg", "variante", "rpe",
    "energie", "beschwerden", "notiz", "einheit_id", "reserve", "reserve_art", "geraet", "griff",
    "ausfuehrung", "erhoehung", "band", "pause_s", "schmerz", "schmerz_ort"];
  function q(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""').replace(/\r?\n/g, " ") + '"'; }
  function csv() {
    var rows = [CSV_HEAD.join(",")];
    S.data.sessions.slice().sort(function (a, b) {
      return a.date === b.date ? (a.id || 0) - (b.id || 0) : (a.date < b.date ? -1 : 1);
    }).forEach(function (s) {
      var sessIssue = s.issues ? (s.issues.parts.join("|") + " " + (s.issues.note || "")).trim() : "";
      s.exercises.forEach(function (e) {
        var schmerzTxt = e.schmerz ? ((e.ort || "Stelle offen") + " " + e.schmerz + "/10") : "";
        var beschwerden = [sessIssue, schmerzTxt].filter(Boolean).join("; ");
        var rpe = e.v2 ? rpeAusReserve(e.unit, e.rir) : e.rpe;
        e.sets.forEach(function (val, i) {
          if (val === null || val === undefined) return;
          rows.push([s.date, s.dayId, (e.id === "bss" && e.ausf === "einfache Squats") ? "squat" : e.id, i + 1, val, e.unit, e.kg == null ? "" : e.kg,
            q(e.v2 ? beschreibung(e) : (e.variant || "")), rpe == null ? "" : rpe,
            s.energy == null ? "" : s.energy, q(beschwerden), q(s.note || ""),
            s.id, e.rir == null ? "" : e.rir, e.v2 && e.rir != null ? (e.unit === "sec" ? "SIR" : "RIR") : "",
            q(e.geraet || ""), q(e.griff || ""), q(e.ausf || ""), e.erh || "", e.band ? 1 : "",
            e.pause || "", e.schmerz || "", q(e.ort || "")].join(","));
        });
      });
    });
    S.data.weights.forEach(function (w) {
      var r = new Array(CSV_HEAD.length).fill("");
      r[0] = w.date; r[1] = "koerpergewicht"; r[4] = w.kg; r[5] = "kg";
      rows.push(r.join(","));
    });
    return rows.join("\n");
  }

  /* ------------------------ Pausentimer ------------------------ */
  var audioCtx = null;
  function unlockAudio() {
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
  }
  function beep() {
    if (!audioCtx) return;
    try {
      [0, 0.25, 0.5].forEach(function (t) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.18);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
      });
    } catch (e) { /* stumm */ }
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  function startPause(exId) {
    var e = S.entries[exId];
    if (!e) return;
    var ex = day().ex.filter(function (x) { return x.id === exId; })[0];
    var dauer = e.pause || STANDARD_PAUSE;
    S.timer = { end: Date.now() + dauer * 1000, total: dauer, name: ex.name.split(" (")[0], piept: false };
    updateTimer();
  }
  function timerHTML() {
    var t = S.timer;
    if (!t) return "";
    var rest = (t.end - Date.now()) / 1000;
    if (rest <= 0) {
      return '<div class="timer done" id="timer"><span>Pause vorbei · ' + esc(t.name) +
        '</span><button class="x" data-act="timer-stop">OK</button></div>';
    }
    var pct = Math.max(0, Math.min(100, 100 - rest / t.total * 100));
    return '<div class="timer" id="timer"><b class="mono">' + mmss(rest) + '</b>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span>' +
      '<button class="x" data-act="timer-plus">+30</button>' +
      '<button class="x" style="margin-left:0" data-act="timer-stop">Stopp</button></div>';
  }
  function updateTimer() {
    var el = document.getElementById("timer");
    var t = S.timer;
    if (t && Date.now() >= t.end && !t.piept) { t.piept = true; beep(); }
    if (t && Date.now() >= t.end + 20000) S.timer = null;   // nach 20 s ausblenden
    if (el) {
      var html = timerHTML();
      if (html) el.outerHTML = html; else el.remove();
    } else if (S.timer && S.view === "log") {
      var inner = document.querySelector(".savebar .inner");
      if (inner) inner.insertAdjacentHTML("afterbegin", timerHTML());
    }
  }
  setInterval(function () { if (S.timer) updateTimer(); }, 500);

  /* ------------------------ Render ------------------------ */
  function exerciseCard(ex, hist) {
    var e = S.entries[ex.id];
    var m = meta(ex);
    var key = variantKey(e);
    var same = hist.filter(function (x) { return x.key === key; });
    var last = same[0] || null;
    var lastAny = hist[0] || null;
    var isTotal = !!ex.total;
    var cur = sum(e.sets);
    var doneN = filledSets(e.sets).length;

    // Bestwert in derselben Variante: hoechster Einzelsatz bzw. hoechste Summe bei Gesamtzeit
    var best = null;
    same.forEach(function (x) {
      var w = isTotal ? sum(x.sets) : Math.max.apply(null, filledSets(x.sets));
      if (best === null || w > best.w) best = { w: w, date: x.date };
    });

    var ready = !ex.warmup && last && (isTotal
      ? sum(last.sets) >= ex.total[1]
      : filledSets(last.sets).length >= ex.sets && filledSets(last.sets).every(function (s) { return s >= ex.max; }));

    var goal = isTotal
      ? "Ziel " + (ex.total[0] === ex.total[1] ? ex.total[0] + " s gesamt" : ex.total[0] + "–" + ex.total[1] + " s gesamt")
      : "Ziel " + ex.sets + " × " + ex.min + "–" + ex.max +
        (ex.unit === "sec" ? "s" : ex.unit === "side" ? " pro Bein" : "") + (ex.rirZiel ? " · " + ex.rirZiel : "");

    var countCls = isTotal ? (cur >= ex.total[0] ? "full" : cur > 0 ? "part" : "")
                           : (doneN >= ex.sets ? "full" : doneN > 0 ? "part" : "");
    var countTxt = isTotal ? cur + " s" : doneN + "/" + ex.sets;

    var h = '<div class="card' + (ex.warmup ? " warm" : "") + '"><div class="pad">';
    h += '<div class="exhead"><div style="min-width:0">';
    if (ex.warmup) h += '<span class="eyebrow">Aufwärmen · locker</span>';
    h += '<h3 class="exname">' + esc(ex.name) + '</h3>';
    var bes = e.v2 ? beschreibung(e) : (e.variant || "");
    if (bes && !ex.warmup) h += '<div class="exvar">' + esc(bes) + '</div>';
    h += '</div><span class="count ' + countCls + ' mono" id="cnt_' + ex.id + '">' + countTxt + '</span></div>';

    h += '<div class="marks"><span class="goal">' + esc(goal) + '</span>';
    if (ex.supersatz) h += '<span class="goal">⇄ Supersatz mit ' + esc(ex.supersatz) + '</span>';
    if (last) {
      h += '<button class="lastbtn" data-act="hist" data-ex="' + ex.id + '">letztes Mal <b class="mono">' +
        esc(setsStr(last.sets, ex.unit)) + '</b>' + (last.kg ? " +" + last.kg + "kg" : "") +
        ' <span class="d">· ' + fmt(last.date) + '</span> ' + (S.openHist[ex.id] ? "▲" : "▼") + '</button>';
      if (best && !ex.warmup) {
        h += '<span class="best">Bestwert <b class="mono">' + best.w + (ex.unit === "sec" ? " s" : "") +
          '</b> · ' + fmt(best.date) + '</span>';
      }
    } else if (lastAny) {
      // Andere Ausfuehrung (oder Alt-Eintrag ohne Struktur): zeigen, aber kennzeichnen
      h += '<button class="lastbtn" data-act="hist" data-ex="' + ex.id + '">letztes Mal <b class="mono">' +
        esc(setsStr(lastAny.sets, ex.unit)) + '</b> <span class="d">· ' + fmt(lastAny.date) +
        ' · andere Ausführung</span> ' + (S.openHist[ex.id] ? "▲" : "▼") + '</button>';
    } else {
      h += '<span class="nolast">noch kein Vorwert</span>';
    }
    h += '</div>';

    if (S.openHist[ex.id] && hist.length) {
      h += '<div class="hist">';
      hist.slice(0, 4).forEach(function (x) {
        h += '<div><span class="l">' + fmt(x.date, true) + (x.text ? " · " + esc(x.text) : "") +
          (x.schmerz ? " · ⚠ " + x.schmerz + "/10" : "") + '</span>' +
          '<span class="r mono">' + esc(setsStr(x.sets, ex.unit)) + (x.kg ? " +" + x.kg : "") + '</span></div>';
      });
      h += '</div>';
    }

    // Schonvariante: beim letzten Mal an dieser Uebung Schmerz ueber 3/10
    if (lastAny && lastAny.schmerz > 3 && !ex.warmup) {
      h += '<div class="warnbox">⚠ Letztes Mal (' + fmt(lastAny.date) + ') Schmerz ' + lastAny.schmerz + '/10' +
        (lastAny.ort ? ' · ' + esc(lastAny.ort) : '') + '. Leichtere Option wählen (mit Band / negativ / im Stütz) und einen Satz weniger.</div>';
    }

    var zehn = (ex.id === "pullup" || ex.id === "chinup") && last &&
      filledSets(last.sets).length >= ex.sets && filledSets(last.sets).every(function (s) { return s >= 10; });
    if (zehn) {
      h += '<div class="prog">↑ 10 in allen Sätzen — jetzt 2,5–5 kg Zusatzgewicht und wieder bei 5 starten. ' +
        'Zusatzgewicht nur, wenn beim letzten Mal keine Beschwerden über 3/10.</div>';
    } else if (ready) {
      h += '<div class="prog">↑ ' + (isTotal
        ? "Haltezeit erreicht — jetzt längere Sätze statt mehr Sätze"
        : "Oberes Ende in allen Sätzen erreicht — jetzt schwerere Option (Ringe, Füße erhöht, Zusatzgewicht) und wieder unten im Bereich starten") + '</div>';
    }

    if (isTotal) {
      h += '<p class="hint">So viele Sätze wie nötig — Satz beenden, sobald die Linie bricht, nicht wenn die Zeit um ist.</p>';
    }

    var ghostSrc = last || lastAny;
    h += '<div class="sets">';
    for (var i = 0; i < e.sets.length; i++) {
      var v = e.sets[i];
      var ghost = ghostSrc && ghostSrc.sets[i] != null ? ghostSrc.sets[i] : null;
      var empty = v === null || v === undefined;
      var beat = !empty && ghost !== null && v > ghost;
      var extra = i >= ex.sets;
      h += '<div class="setrow"><span class="setno mono' + (extra ? " extra" : "") + '">' + (i + 1) + '</span>' +
        '<div class="step">' +
        '<button data-act="dec" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="weniger">−</button>' +
        '<input class="val mono' + (beat ? " beat" : "") + '" type="number" inputmode="numeric" ' +
        'pattern="[0-9]*" min="0" step="1" enterkeyhint="done" ' +
        'id="s_' + ex.id + '_' + i + '" data-fld="set" data-ex="' + ex.id + '" data-i="' + i + '" ' +
        'value="' + (empty ? "" : v) + '" placeholder="' + (ghost === null ? "–" : ghost) + '" ' +
        'aria-label="Satz ' + (i + 1) + '">' +
        (ex.unit === "sec" ? '<span class="unit">s</span>' : "") +
        '<button data-act="inc" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="mehr">+</button></div>' +
        '<button class="clr" data-act="clr" data-ex="' + ex.id + '" data-i="' + i + '" aria-label="' +
        (extra && empty ? "Satz entfernen" : "zurücksetzen") + '"' +
        (empty && !extra ? ' style="visibility:hidden"' : '') + '>×</button>' +
        '</div>';
    }
    h += '</div>';
    h += '<button class="addset" data-act="addset" data-ex="' + ex.id + '">+ Satz</button>';
    h += '</div>';

    if (!ex.warmup) {
      var summary = [];
      if (e.kg) summary.push("+" + e.kg + " kg");
      if (e.rir != null) summary.push(reserveText(ex.unit, e.rir));
      else if (e.rpeAlt != null) summary.push("RPE " + e.rpeAlt);
      if (e.pause && e.pause !== STANDARD_PAUSE) summary.push("Pause " + mmss(e.pause));
      if (e.schmerz) summary.push("⚠ " + e.schmerz + "/10" + (e.ort ? " " + e.ort : ""));
      h += '<button class="opts' + (e.schmerz ? " pain" : "") + '" data-act="opts" data-ex="' + ex.id + '"><span>' +
        (summary.length ? esc(summary.join("  ·  ")) : "Ausführung, Reserve, Pause, Schmerz") +
        '</span><span style="color:#94a3b8">' + (S.openOpts[ex.id] ? "▲" : "▼") + '</span></button>';

      if (S.openOpts[ex.id]) {
        h += '<div class="optbody">';
        // Reserve
        h += '<div><div class="olabel">' + (ex.unit === "sec" ? "Sekunden in Reserve" : "Wiederholungen in Reserve") +
          ' · letzter Satz</div><div class="num">';
        var stufen = ex.unit === "sec" ? SIR_STUFEN : [0, 1, 2, 3, 4];
        stufen.forEach(function (r) {
          var lab = ex.unit === "sec" ? (r >= 15 ? "mehr" : r + " s") : (r >= 4 ? "4+" : r);
          h += '<button class="' + (e.rir === r ? "on" : "") + '" data-act="rir" data-ex="' + ex.id +
            '" data-r="' + r + '">' + lab + '</button>';
        });
        h += '</div><p class="ohint">0 = wirklich nichts mehr drin, nicht „fühlte sich hart an“.' +
          (e.rpeAlt != null ? ' Alt-Eintrag: RPE ' + e.rpeAlt + '.' : '') + '</p></div>';
        // Ausfuehrung
        if (ex.variants.length) {
          h += '<div><div class="olabel">Ausführung</div><div class="tags">';
          ex.variants.forEach(function (v) {
            h += '<button class="tag' + (e.ausf === v ? " on" : "") + '" data-act="ausf" data-ex="' +
              ex.id + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
          });
          h += '</div></div>';
        }
        if (m.geraet) {
          h += '<div><div class="olabel">Gerät</div><div class="tags">';
          m.geraet.forEach(function (v) {
            h += '<button class="tag' + (e.geraet === v ? " on" : "") + '" data-act="geraet" data-ex="' +
              ex.id + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
          });
          h += '</div></div>';
        }
        if (m.griff) {
          h += '<div><div class="olabel">Griff</div><div class="tags">';
          GRIFFE.forEach(function (v) {
            h += '<button class="tag' + (e.griff === v ? " on" : "") + '" data-act="griff" data-ex="' +
              ex.id + '" data-v="' + esc(v) + '">' + esc(v) + '</button>';
          });
          h += '</div></div>';
        }
        if (m.erh || m.band) {
          h += '<div><div class="olabel">Erleichterung / Erschwerung</div><div class="tags">';
          if (m.erh) {
            [1, 2, 3].forEach(function (n) {
              h += '<button class="tag' + (e.erh === n ? " on" : "") + '" data-act="erh" data-ex="' + ex.id +
                '" data-n="' + n + '">Füße erhöht ' + n + '</button>';
            });
          }
          if (m.band) {
            h += '<button class="tag' + (e.band ? " on" : "") + '" data-act="band" data-ex="' + ex.id + '">mit Band</button>';
          }
          h += '</div></div>';
        }
        h += '<div class="fld"><label>Zusatzgewicht</label>' +
          '<input type="number" inputmode="decimal" step="0.5" placeholder="0" value="' +
          (e.kg == null ? "" : e.kg) + '" data-fld="kg" data-ex="' + ex.id + '"><span style="font-size:12px;color:#94a3b8">kg</span></div>';
        // Pause
        h += '<div><div class="olabel">Pause zwischen den Sätzen</div><div class="num">';
        PAUSEN.forEach(function (p) {
          h += '<button class="' + (e.pause === p ? "on" : "") + '" data-act="pause" data-ex="' + ex.id +
            '" data-p="' + p + '">' + mmss(p) + '</button>';
        });
        h += '</div></div>';
        // Schmerz
        h += '<div><div class="olabel">Schmerz (nur wenn etwas zieht)</div><div class="num pain">';
        for (var sc = 1; sc <= 10; sc++) {
          h += '<button class="' + (e.schmerz === sc ? "on" : "") + '" data-act="schmerz" data-ex="' + ex.id +
            '" data-n="' + sc + '">' + sc + '</button>';
        }
        h += '</div>';
        if (e.schmerz) {
          h += '<div class="tags" style="margin-top:8px">';
          ORTE.forEach(function (o) {
            h += '<button class="tag warn' + (e.ort === o ? " on" : "") + '" data-act="ort" data-ex="' + ex.id +
              '" data-v="' + esc(o) + '">' + esc(o) + '</button>';
          });
          h += '</div>';
        }
        h += '</div>';
        h += '<input type="text" placeholder="Anmerkung zur Übung (optional)" value="' + esc(e.variant) +
          '" data-fld="variant" data-ex="' + ex.id + '">';
        h += '</div>';
      }
    }
    h += '</div>';
    return h;
  }

  /* Nach Tastatureingaben nur die betroffenen Anzeigen nachziehen —
     ein kompletter Neuaufbau wuerde den Fokus aus dem Feld werfen. */
  function syncCounters(exId) {
    var d = day();
    var ex = d.ex.filter(function (x) { return x.id === exId; })[0];
    if (!ex) return;
    var e = S.entries[exId];
    if (!e) return;

    var badge = document.getElementById("cnt_" + exId);
    if (badge) {
      var isTotal = !!ex.total;
      var cur = sum(e.sets);
      var doneN = filledSets(e.sets).length;
      badge.textContent = isTotal ? cur + " s" : doneN + "/" + ex.sets;
      var full = isTotal ? cur >= ex.total[0] : doneN >= ex.sets;
      var part = isTotal ? cur > 0 : doneN > 0;
      badge.className = "count mono" + (full ? " full" : part ? " part" : "");
    }

    var hist = histByEx(S.editId)[exId] || [];
    var key = variantKey(e);
    var last = hist.filter(function (x) { return x.key === key; })[0] || hist[0] || null;
    for (var i = 0; i < e.sets.length; i++) {
      var inp = document.getElementById("s_" + exId + "_" + i);
      if (!inp) continue;
      var val = e.sets[i];
      var ghost = last && last.sets[i] != null ? last.sets[i] : null;
      var beat = val !== null && ghost !== null && val > ghost;
      inp.className = "val mono" + (beat ? " beat" : "");
      var x = inp.parentNode.parentNode.querySelector(".clr");
      if (x) x.style.visibility = (val === null && i < ex.sets) ? "hidden" : "visible";
    }

    var btn = document.querySelector('[data-act="save"]');
    if (btn) {
      var filled = formFilled();
      if (filled && !S.saving) {
        btn.removeAttribute("disabled");
        btn.textContent = S.editId ? "Änderungen speichern" : "Einheit speichern";
      } else {
        btn.setAttribute("disabled", "");
        btn.textContent = S.saving ? "Speichert…" : "Noch kein Satz erfasst";
      }
    }
  }

      ? '<span class="stat ok">gesichert</span>'

      h += '<div class="card energie"><div class="simple"><span>Frische' + (isToday ? ' heute' : '') + '</span><div class="num">';
      [1, 2, 3, 4, 5].forEach(function (n) {
        h += '<button class="' + (S.energy === n ? "on" : "") + '" data-act="energy" data-n="' + n + '">' + n + '</button>';
      });
      h += '</div></div></div>';

      var hist = histByEx(S.editId);
      if (S.planId !== "b") {
        h += '<p class="hint" style="margin:0 2px">Aufwärmen vor Ort (Scapula Pull-ups, Support Hold), dann ' +
          '2 leichte Sätze der ersten Kraftübung — wird nicht erfasst.</p>';
      }
      day().ex.forEach(function (ex) { h += exerciseCard(ex, hist[ex.id] || []); });

      h += '<div class="card"><div class="pad"><p style="font-size:14px;color:#334155;margin:0 0 10px">Sonstige Beschwerden?' +
        '<span style="display:block;font-size:11px;color:#94a3b8">Schmerz bei einer Übung besser direkt dort eintragen</span></p><div class="tags">';
      PARTS.forEach(function (p) {
        h += '<button class="tag warn' + (S.issues.indexOf(p) >= 0 ? " on" : "") + '" data-act="issue" data-p="' +
          esc(p) + '">' + esc(p) + '</button>';
      });
      h += '</div>';
      if (S.issues.length) {
        h += '<input type="text" style="margin-top:10px" placeholder="Wo genau, wie stark?" value="' +
          esc(S.issueNote) + '" data-fld="issueNote">';
      }
      h += '</div></div>';

      h += '<textarea rows="2" placeholder="Notiz zur Einheit" data-fld="note">' + esc(S.note) + '</textarea>';
    } else {
      var lastExp = null;
      try { lastExp = window.localStorage.getItem(EXPORT_KEY); } catch (e) { lastExp = null; }
      h += '<div class="card"><div class="pad">' +
        '<p style="font-size:14px;font-weight:600;margin:0">Export an den Coach</p>' +
        '<p style="font-size:12px;color:#64748b;margin:4px 0 0;line-height:1.45">Im Menü „In Dateien sichern“ wählen, dann ' +
        '<b>iCloud Drive → Garmin → Logbuch</b>. iOS merkt sich den Ordner. Der Mac übernimmt die Datei beim nächsten Sync.' +
        (lastExp ? '<br>Zuletzt gesendet: ' + fmt(lastExp, true) : '') + '</p>' +
        '<button class="big" data-act="share">An Dateien senden</button></div></div>';

      if (!S.data.sessions.length) {
        h += '<div class="empty"><p>Noch keine Einheit gespeichert.</p>' +
          '<button class="tag on" data-act="view">Erste Einheit loggen</button></div>';
      } else {
        sortedSessions().forEach(function (s) {
          h += '<div class="card"><div class="pad">' +
            '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">' +
            '<span style="font-size:14px;font-weight:600">' + esc(s.dayId + " " + s.dayName) + '</span>' +
            '<span class="mono" style="font-size:12px;color:#94a3b8;white-space:nowrap">' + fmt(s.date, true) +
            ' <button class="tag" style="padding:3px 9px;font-size:11px" data-act="edit" data-id="' + s.id + '">Bearbeiten</button>' +
            ' <button data-act="del" data-id="' + s.id + '" style="color:#cbd5e1;padding:0 6px;font-size:16px" aria-label="löschen">×</button></span></div>' +
            '<div style="margin-top:8px">';
          s.exercises.forEach(function (e) {
            var t = e.v2 ? beschreibung(e) : e.variant;
            var r = e.v2 ? reserveText(e.unit, e.rir) : (e.rpe ? "RPE " + e.rpe : "");
            h += '<div class="sess"><span class="n' + (e.warmup ? " warm" : "") + '">' + esc(e.name) +
              (t ? ' <span style="color:#94a3b8">· ' + esc(t) + '</span>' : "") + '</span>' +
              '<span class="mono">' + esc(setsStr(e.sets, e.unit)) + (e.kg ? " +" + e.kg : "") +
              (r ? ' <span style="color:#94a3b8">' + esc(r) + '</span>' : "") +
              (e.schmerz ? ' <span style="color:#b45309">⚠' + e.schmerz + '</span>' : "") + '</span></div>';
          });
          h += '</div>';
          if (s.energy || s.issues || s.note) {
            var m = [];
            if (s.energy) m.push("Frische " + s.energy + "/5");
            if (s.issues) m.push("⚠ " + s.issues.parts.join(", ") + " " + (s.issues.note || ""));
            if (s.note) m.push(s.note);
            h += '<p class="meta">' + esc(m.join("  ·  ")) + '</p>';
          }
          h += '</div></div>';
        });
      }

      var lw = S.data.weights[S.data.weights.length - 1];
      h += '<div class="card"><div class="simple"><span style="flex:1">Körpergewicht <span style="color:#94a3b8">(optional)</span>' +
        '<span style="display:block;font-size:11px;color:#94a3b8">Die Garmin-Waage liefert es ohnehin' +
        (lw ? ' · zuletzt hier ' + lw.kg + ' kg, ' + fmt(lw.date, true) : '') + '</span></span>' +
        '<input type="number" inputmode="decimal" step="0.1" placeholder="kg" value="' + esc(S.bw) +
        '" data-fld="bw"><button class="tag" data-act="bw"' + (S.bw ? "" : " disabled") + '>Sichern</button></div></div>';

      h += '<div class="card exp"><div class="pad">' +
        '<p style="font-size:14px;font-weight:600;margin:0">Sicherung</p>' +
        '<p style="font-size:12px;color:#64748b;margin:2px 0 8px">' +
        'Umzug auf ein anderes Gerät oder eine andere Adresse: hier kopieren, dort einfügen. ' +
        'Der Browser-Speicher wandert nicht von selbst mit.</p>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">' +
        '<button class="tag on" data-act="copy">Alles kopieren</button>' +
        '<button class="tag" data-act="dl-json">Als Datei laden</button>' +
        '<button class="tag" data-act="dl-csv">CSV laden</button></div>' +
        '<textarea rows="3" readonly id="bak-out" data-act="selectall">' + esc(JSON.stringify(S.data)) +
        '</textarea>' +
        '<p style="font-size:14px;font-weight:600;margin:14px 0 0">Sicherung einlesen</p>' +
        '<p style="font-size:12px;color:#64748b;margin:2px 0 6px">' +
        'Kopierten Text hier einfügen und übernehmen. Vorhandene Einheiten bleiben erhalten.</p>' +
        '<textarea rows="3" id="bak-in" placeholder="Sicherung hier einfügen"></textarea>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
        '<button class="tag on" data-act="imp-text">Text übernehmen</button>' +
        '<button class="tag" data-act="imp">Aus Datei</button></div>' +
        '</div></div>';
    }

    h += '</main>';

    if (S.view === "log") {
      var filled = formFilled();
      h += '<div class="savebar"><div class="inner">' + timerHTML() +
        '<button class="save" data-act="save"' + (filled && !S.saving ? "" : " disabled") + '>' +
        (S.saving ? "Speichert…" : filled ? (S.editId ? "Änderungen speichern" : "Einheit speichern")
                                          : "Noch kein Satz erfasst") +
        '</button></div></div>';
    }

    if (S.toast) h += '<div class="toast"><span>' + esc(S.toast) + '</span></div>';

    root.innerHTML = h;
  }

  /* ------------------------ Events ------------------------ */
  function wechselErlaubt(ziel) {
    // Ungespeicherte Eingaben nicht stillschweigend verwerfen
    if (!S.dirty || !formFilled()) return true;
    if (S.confirmSwitch === ziel) { S.confirmSwitch = null; return true; }
    S.confirmSwitch = ziel;
    flash("Ungespeicherte Eingaben — nochmal tippen verwirft sie");
    return false;
  }

  document.addEventListener("click", function (ev) {
    unlockAudio();
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var a = t.dataset.act, ex = t.dataset.ex, e = ex ? S.entries[ex] : null;
    if (a !== "save") S.confirmSave = false;

    if (a === "plan") {
      if (S.planId === t.dataset.p || !wechselErlaubt("plan" + t.dataset.p)) return;
      S.planId = t.dataset.p; S.dayIdx = rotationIdx(); S.date = null; clearDraft(); loadExistingOrBlank();
    }
    else if (a === "day") {
      var ni = +t.dataset.i;
      if (S.dayIdx === ni || !wechselErlaubt("day" + ni)) return;
      S.dayIdx = ni; clearDraft(); loadExistingOrBlank();
    }
    else if (a === "view") { S.view = S.view === "log" ? "history" : "log"; }
    else if (a === "energy") { var n = +t.dataset.n; S.energy = S.energy === n ? null : n; markDirty(); }
    else if (a === "issue") { var p = t.dataset.p; var k = S.issues.indexOf(p);
      if (k >= 0) S.issues.splice(k, 1); else S.issues.push(p); markDirty(); }
    else if (a === "hist") { S.openHist[ex] = !S.openHist[ex]; }
    else if (a === "opts") { S.openOpts[ex] = !S.openOpts[ex]; }
    else if (a === "ausf") { e.ausf = e.ausf === t.dataset.v ? "" : t.dataset.v; e.v2 = true; markDirty(); }
    else if (a === "geraet") { e.geraet = e.geraet === t.dataset.v ? "" : t.dataset.v; e.v2 = true; markDirty(); }
    else if (a === "griff") { e.griff = e.griff === t.dataset.v ? "" : t.dataset.v; e.v2 = true; markDirty(); }
    else if (a === "erh") { var en = +t.dataset.n; e.erh = e.erh === en ? 0 : en; e.v2 = true; markDirty(); }
    else if (a === "band") { e.band = !e.band; e.v2 = true; markDirty(); }
    else if (a === "rir") { var r = +t.dataset.r; e.rir = e.rir === r ? null : r; e.v2 = true; markDirty(); }
    else if (a === "pause") { e.pause = +t.dataset.p; markDirty(); }
    else if (a === "schmerz") { var sn = +t.dataset.n; e.schmerz = e.schmerz === sn ? null : sn;
      if (!e.schmerz) e.ort = ""; e.v2 = true; markDirty(); }
    else if (a === "ort") { e.ort = e.ort === t.dataset.v ? "" : t.dataset.v; markDirty(); }
    else if (a === "addset") { e.sets.push(null); markDirty(); }
    else if (a === "timer-stop") { S.timer = null; updateTimer(); return; }
    else if (a === "timer-plus") { if (S.timer) { S.timer.end += 30000; S.timer.total += 30; } updateTimer(); return; }
    else if (a === "inc" || a === "dec" || a === "clr") {
      var i = +t.dataset.i;
      var exDef = day().ex.filter(function (x) { return x.id === ex; })[0];
      var step = 1;
      if (a === "clr") {
        if (e.sets[i] === null && i >= exDef.sets) { e.sets.splice(i, 1); markDirty(); render(); return; }
        e.sets[i] = null;
      } else {
        var war = e.sets[i];
        var hist2 = histByEx(S.editId)[ex] || [];
        var key2 = variantKey(e);
        var l2 = hist2.filter(function (x) { return x.key === key2; })[0] || hist2[0];
        var ghost2 = l2 && l2.sets[i] != null ? l2.sets[i] : 0;
        var base = war == null ? ghost2 : war;
        e.sets[i] = a === "inc" ? base + step : Math.max(0, base - step);
        if (war == null && !exDef.warmup) startPause(ex);
      }
      markDirty();
      var fld = document.getElementById("s_" + ex + "_" + i);
      if (fld) {
        fld.value = e.sets[i] === null ? "" : e.sets[i];
        syncCounters(ex);
        return; // ohne Neuaufbau, damit die Tastatur nicht springt
      }
    }
    else if (a === "retry") { retry(); return; }
    else if (a === "edit") {
      var sid = Number(t.dataset.id);
      var s = S.data.sessions.filter(function (x) { return x.id === sid; })[0];
      if (!s || !wechselErlaubt("edit" + sid)) return;
      var pl = s.planId && PLANS[s.planId] ? s.planId : (s.dayId && PLANS[s.dayId[0]] ? s.dayId[0] : "a");
      var di = PLANS[pl].days.map(function (d) { return d.id; }).indexOf(s.dayId);
      if (di < 0) { flash("Tag dieser Einheit gibt es im Plan nicht mehr"); return; }
      S.planId = pl; S.dayIdx = di; S.view = "log"; clearDraft();
      fillFromSession(s); S.openOpts = {}; S.openHist = {};
      window.scrollTo(0, 0);
    }
    else if (a === "del") {
      var id = Number(t.dataset.id);
      if (S.confirmDel === id) {
        S.confirmDel = null;
        persist({ sessions: S.data.sessions.filter(function (x) { return x.id !== id; }),
                  weights: S.data.weights }).then(render);
        return;
      }
      S.confirmDel = id;
      flash("Nochmal tippen zum Löschen");
      return;
    }
    else if (a === "save") { saveSession(); return; }
    else if (a === "share") { shareExport(); return; }
    else if (a === "bw") { saveWeight(); return; }
    else if (a === "selectall") { t.select(); return; }
    else if (a === "copy") {
      var out = document.getElementById("bak-out");
      if (out) {
        out.select();
        out.setSelectionRange(0, 999999);
        var done = false;
        try { done = document.execCommand("copy"); } catch (e3) { done = false; }
        if (!done && navigator.clipboard) {
          navigator.clipboard.writeText(out.value).then(function () { flash("Kopiert"); },
            function () { flash("Bitte von Hand markieren und kopieren"); });
          return;
        }
        flash(done ? "Kopiert" : "Bitte von Hand markieren und kopieren");
      }
      return;
    }
    else if (a === "imp-text") {
      var inn = document.getElementById("bak-in");
      if (!inn || !inn.value.trim()) { flash("Kein Text eingefügt"); return; }
      importJSON(inn.value.trim()).then(render);
      return;
    }
    else if (a === "dl-json") {
      download("trainingslog-" + todayISO() + ".json", JSON.stringify(S.data, null, 2), "application/json");
      return;
    }
    else if (a === "dl-csv") {
      download("trainingslog-" + todayISO() + ".csv", csv(), "text/csv;charset=utf-8");
      return;
    }
    else if (a === "imp") {
      var inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".json,application/json";
      inp.onchange = function () {
        var f = inp.files && inp.files[0];
        if (!f) return;
        var fr = new FileReader();
        fr.onload = function () { importJSON(String(fr.result)).then(render); };
        fr.readAsText(f);
      };
      inp.click();
      return;
    }
    render();
  });

  /* Textfelder: State ohne Re-Render pflegen, damit der Fokus bleibt */
  document.addEventListener("input", function (ev) {
    var t = ev.target, f = t.dataset && t.dataset.fld;
    if (!f) return;
    if (f === "note") { S.note = t.value; markDirty(); }
    else if (f === "issueNote") { S.issueNote = t.value; markDirty(); }
    else if (f === "bw") {
      S.bw = t.value;
      var btn = document.querySelector('[data-act="bw"]');
      if (btn) { if (S.bw) btn.removeAttribute("disabled"); else btn.setAttribute("disabled", ""); }
    }
    else if (f === "set") {
      var eid = t.dataset.ex, idx = +t.dataset.i;
      var raw = t.value.replace(/[^0-9]/g, "");
      if (raw !== t.value) t.value = raw;
      S.entries[eid].sets[idx] = raw === "" ? null : Number(raw);
      markDirty();
      syncCounters(eid);
    }
    else if (f === "date") {
      S.date = t.value && t.value !== todayISO() ? t.value : null;
      // Leeres Formular: vorhandene Einheit dieses Tages laden. Mit Eingaben:
      // nur das Datum aendern (verschiebt eine falsch datierte Einheit).
      if (!S.dirty || !formFilled()) loadExistingOrBlank(); else markDirty();
      render();
    }
    else if (f === "kg") { S.entries[t.dataset.ex].kg = t.value === "" ? null : Number(t.value.replace(",", ".")); markDirty(); }
    else if (f === "variant") { S.entries[t.dataset.ex].variant = t.value; markDirty(); }
  });

  /* Pause startet, wenn ein Satz per Tastatur fertig eingetragen ist */
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (!t.dataset || t.dataset.fld !== "set" || t.value === "") return;
    var exDef = day().ex.filter(function (x) { return x.id === t.dataset.ex; })[0];
    if (exDef && !exDef.warmup) startPause(t.dataset.ex);
  });

  /* Beim Zurueckkehren in die App den Timer sofort nachziehen */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && S.timer) updateTimer();
  });

  load();
})();

</script>
</body>
</html>
